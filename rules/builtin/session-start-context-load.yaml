name: session-start-context-load
label: hook
description: Surface SessionStart context loading as a reminder, not a correctness gate.
default_severity: warn
hooks:
  - on-session-start
check: |
  On session start, resume, clear, or compact, load the pipeline summary and priority context files as reminders.
  Prefer compact context views when available and fall back to full files.
  Load Knowledge Ledger knowledge compact and category indexes, but never raw records by default.
  Inject active always rules into the session context.
  Hook absence or failure must not block ordinary prompts, tools, diagnostics, or ordinary-file records.
