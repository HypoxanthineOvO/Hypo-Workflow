name: stop-hook-self-check
label: hook
description: Surface the Stop Hook self-check as a reminder, not a gate.
default_severity: warn
hooks:
  - post-step
check: |
  Before the agent stops during an active pipeline, inspect state and expected reports.
  If the current step or required report is incomplete, remind with the next concrete action instead of blocking the stop.
  Non-safety Hook failure fails open with a short warning.
