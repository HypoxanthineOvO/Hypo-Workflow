name: minimal
description: Minimal defaults that keep only hook reminders enabled.
rules:
  git-clean-check: off
  config-valid: off
  cycle-closed: off
  conflict-check: off
  report-language: off
  progress-timezone: off
  progress-verbosity: off
  commit-format: off
  auto-continue-threshold: off
  plan-tool-required: off
  knowledge-ledger-self-check: warn
  review-strictness: off
  readme-freshness: off
  skill-quality: off
  stop-hook-self-check: warn
  session-start-context-load: warn
