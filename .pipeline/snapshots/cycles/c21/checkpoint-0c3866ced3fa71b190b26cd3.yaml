    body: >-
      **Consultation-first action boundary.** When the user is discussing background, an idea, a complaint, a question,
      or a possible solution without clearly requesting direct execution, first present the concrete understanding and
      recommended direction, then wait for authorization before editing. A clear bounded imperative or an affirmative
      reply to an already displayed plan authorizes only that shown scope. Explain a new Workflow concept in one
      sentence on its first use.
