    body: >-
      Destructive or external operations, plugin installation, user-level configuration writes, remote PR/MR writes,
      Release publication, and remote clone/download require explicit, scope-bound human authorization. Local
      preparation without remote effects may precede the gate. Durable automation preferences cannot silently waive
      these boundaries; current authorization is represented by exact, single-use, drift-sensitive Receipts rather than
      a broad whitelist flag.
