      has ordered Milestones, internal verification at Milestone boundaries, and one final Cycle-level manual acceptance
      gate. Maintain is ambient. Approval creates waiting_to_start, and only explicit start intent begins work. After
      that start, authorized execution may continue across ordinary internal Milestone boundaries without repeated
      approval, but scope, risk, remote-effect, revision, and acceptance gates remain binding. Direction-changing
      feedback creates needs_revision and a revised proposal rather than edit authorization. Successful Delivery ends
      only after a scoped acceptance Receipt.
