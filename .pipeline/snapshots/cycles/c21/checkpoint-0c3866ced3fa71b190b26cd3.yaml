    body: >-
      The generic Rules command and generic Structured Rules authority are retired from the product contract and remain
      M8 cleanup candidates. User-stated requirements, preferences, feedback, authorization scope, and turn- or
      Delivery-scoped constraints remain supported at their actual scope: confirmed durable facts become individual
      Records, while user confirmation, execution grants, and dangerous-operation grants use actor-, scope-, plan-hash-,
      expiry-, and consumption-bound Receipts. Adapters and Markdown guidance are projections and cannot become
      competing authority. A scoped constraint or grant must not be silently promoted into a permanent global rule.
    path: .pipeline/memory/records/project-d604d20eae74/decision/decision-286fab099f28f9b92312fd13c0cc1a91.md
