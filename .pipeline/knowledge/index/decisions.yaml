category: decisions
entries:
  - created_at: 2026-05-06T22:14:11+08:00
    items:
      - rationale: >-
          The root README should introduce common Hypo-Workflow capabilities and point to platform guides instead of
          duplicating installation commands that drift.
        title: README stays platform-neutral
      - rationale: >-
          Codex, Claude Code, OpenCode, Cursor, Copilot, and Trae have different install surfaces, supported features,
          and enforcement limits.
        title: Platform guides own concrete installation and sync commands
      - rationale: >-
          The Hypo-Workflow `hw` plugin exposes `/hw:*`; the official OpenAI Codex plugin is optional delegation
          infrastructure and must remain a separate confirmed install flow.
        title: Claude Code has two plugin flows
      - rationale: >-
          Cursor, Copilot, and Trae primarily receive generated instruction files; docs must not imply hook or lifecycle
          enforcement they do not provide.
        title: Third-party IDE adapters must state their limits
    record_id: C8-DOC-platform-installation-boundary-20260506
    refs:
      files:
        - README.md
        - docs/user-guide.md
        - docs/platforms/codex.md
        - docs/platforms/claude-code.md
        - docs/platforms/opencode.md
        - docs/platforms/cursor.md
        - docs/platforms/copilot.md
        - docs/platforms/trae.md
        - references/platform-capabilities.md
        - core/src/docs/index.js
    source: C8-docs-release-closeout
    summary: Documentation policy for platform installation, sync responsibilities, and Claude/Codex plugin boundaries.
    tags:
      - c8
      - docs
      - install
      - platform-guides
      - codex
      - claude-code
      - opencode
    type: chat
  - created_at: 2026-05-06T16:23:43+08:00
    items:
      - rationale: >-
          User preferences and project behavior must survive context loss and be checkable during review; Markdown
          instructions are generated views.
        title: Structured Rules/Habits are the authority
      - rationale: >-
          Rules are only useful if Skills, hooks, agents, commands, and generated instructions are reviewed against them
          during plan/test/code gates.
        title: Review must check Skill and platform adapter surfaces
      - rationale: >-
          RTL should be the first reference pack, but the interface must support future local, built-in, and external
          package sources without hardcoding RTL into core.
        title: Domain packs must be externalizable
      - rationale: >-
          Claude Code plugin installation, user-level config writes, and future external domain pack installs are
          external side effects.
        title: Remote or user-level installs require explicit confirmation
      - rationale: >-
          When DPSK is the main planning model, a Codex challenger reduces shallow planning risk without always
          requiring expensive Claude planning.
        title: Codex is the default stronger reviewer for DPSK-led plans
    record_id: C8-PLAN-domain-pack-boundary-and-review-rules-20260506
    refs:
      files:
        - .pipeline/design-spec.md
        - .pipeline/architecture.md
        - .pipeline/feature-queue.yaml
        - .pipeline/prompts/06-domain-pack-boundary-protocol-and-knowledge-decision.md
      urls:
