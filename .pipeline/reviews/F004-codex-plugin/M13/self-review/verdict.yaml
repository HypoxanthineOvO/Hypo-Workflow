issues:
  - id: external-domain-checklist-silent-drop
    severity: high
    status: fixed
    refs:
      - core/src/domains/index.js:76
      - core/src/domains/index.js:137
      - references/domain-pack-spec.md
    summary: Unsupported external domain pack refs are represented as metadata by loadDomainPack, but renderDomainChecklist renders an empty string for them, so configured external refs can disappear from prompt/report evidence instead of producing an explicit unsupported/confirmation note.
  - id: structured-rule-writes-path-separator-assumption
    severity: medium
    status: fixed
    refs:
      - core/src/rules/index.js:273
      - core/src/rules/index.js:382
    summary: Structured rule and HABITS writes derive parent directories with path.slice(... lastIndexOf("/")), which is not portable to Windows path separators when running on Windows.
  - id: claude-slash-commands-rendered-as-shell-chain
    severity: medium
    status: fixed
    refs:
      - core/src/claude-codex/index.js:58
      - references/claude-codex-plugin-spec.md
    summary: renderClaudeCodexInstallProposal exposes a single command string created by joining Claude slash commands with " && ", which can be misread by downstream surfaces as a shell command despite the install flow being user-facing slash commands requiring explicit confirmation.
