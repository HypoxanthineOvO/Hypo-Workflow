      - {path: references/commands-spec.md, lines: "65", note: "遗漏 /hw:chat"}
    impact: "两个权威源对命令覆盖范围描述不一致"
    suggested_fix: "同步两个文件的命令列表，或以 commands-spec 为准"
    owner_hint: "spec"
    fix_shape: patch
  - id: C14-F105
    severity: P1
    area: prompt_rules
    title: "根 SKILL.md (1017行) 与 40 个独立 Skill 高度重叠"
    evidence:
      - {path: SKILL.md, lines: "1017 total"}
      - {path: skills/start/SKILL.md, lines: "163"}
      - {path: skills/plan/SKILL.md, lines: "262"}
    impact: "三层定义（SKILL.md → supported commands → 独立 Skill）中行为重复，缺少明确的摘要/规范引用分层"
    suggested_fix: "裁决 SKILL.md 的角色：是索引 + 路由，还是完整复制？明确分层后清理重叠"
    owner_hint: "architecture"
    fix_shape: milestone
  - id: C14-F106
    severity: P1
    area: prompt_rules
    title: "dashboard Skill 退役但文件仍存在"
