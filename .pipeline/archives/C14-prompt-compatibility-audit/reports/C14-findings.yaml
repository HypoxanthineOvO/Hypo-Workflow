      - {path: references/evaluation-spec.md, lines: "143-149", note: "code_quality: 1=优秀, 5=很差"}
    impact: "code_quality 字段无法以单一语义解读"
    suggested_fix: "统一为 V4 方向（1=好, 5=差），在 V1 评分章节加兼容说明"
    owner_hint: "spec"
    fix_shape: milestone
  - id: C14-F102
    severity: P1
    area: workflow_state
    title: "V4 STOP 规则与 V1 兼容性不明确"
    evidence:
      - {path: references/evaluation-spec.md, lines: "246-252", note: "向后兼容说明不涵盖额外的 V4 STOP 条件"}
    impact: "非自适应模式下可能意外触发额外 STOP 条件"
    suggested_fix: "增加配置开关或明确 adaptive_threshold=false 时禁用额外 STOP 条件"
    owner_hint: "spec"
    fix_shape: milestone
  - id: C14-F103
