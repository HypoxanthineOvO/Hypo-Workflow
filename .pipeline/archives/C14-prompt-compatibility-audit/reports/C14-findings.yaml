    impact: "规则定义为 error 级别但缺少自动验证条件，依赖人工检查"
    suggested_fix: "创建对应的内置规则文件，或改为 warn 级别"
    owner_hint: "rules"
    fix_shape: patch
  - id: C14-F108
    severity: P1
    area: prompt_rules
    title: "输出语言规则在 40 个 Skill 中逐字重复（约 280 行）"
    evidence:
