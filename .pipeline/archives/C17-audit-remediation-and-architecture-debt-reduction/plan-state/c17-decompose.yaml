cycle: C17
phase: p2_decompose
status: proposed
created_at: "2026-05-21T17:18:00+08:00"
source:
  discover: .plan-state/c17-audit-remediation-discover.yaml
  audit: .pipeline/audits/audit-001.md
summary: "C17 fixes all audit findings with a staged but breaking cleanup: establish test/audit baseline, extract shared utils, move paths/integrations to layered config with explicit migration, replace partial YAML parsers with js-yaml, split workspace without compatibility shim, migrate ledgers to append-only JSONL, and clean broad barrel exports/docs."
global_constraints:
  - "Root npm test must run directly by C17 completion."
  - "Layered config is authority: project config, user global config, then safe defaults."
  - "Config migration is automatic only when explicitly invoked; sync/start may prompt but must not silently write user config."
  - "workspace/index.js must not remain as a compatibility re-export shim."
  - "Docs/examples must update to explicit module imports."
  - "Old YAML ledgers migrate once to JSONL; no long-term dual write."
  - "External side effects remain explicitly gated."
milestones:
  - id: C17-M0
    name: "Audit Baseline And Root Test Entry"
    objective: "Make the remediation measurable and ensure the project can be tested from the repository root."
    covers:
      - TEST-01
      - audit reproducibility
    technical_solution:
      - "Add root-level package metadata and npm scripts that delegate to core tests without changing runtime behavior."
      - "Add an audit inventory script or fixture that captures hardcoded path, duplicate helper, workspace import, parser, and ledger findings."
      - "Record baseline counts before refactors so later milestones can prove reduction."
    technical_route:
      - "Inspect existing core/package.json and root absence of package.json."
      - "Create root package.json with type/module and scripts for npm test, core test, and audit inventory."
      - "Add focused tests for the audit inventory if implemented as a core helper."
      - "Update README/developer docs only for test entry."
    research_required:
      status: none
      evidence:
        - "core/package.json already defines npm test through node --test core/test/*.test.js."
        - "Repository root currently has no package.json."
    risks_and_alternatives:
      - "Risk: root package metadata may conflict with cli/core packages; keep root private and minimal."
      - "Rejected alternative: continue relying on npm test --prefix core because user explicitly requires root npm test."
    validation_path:
      owner: test worker
      commands:
        - "npm test"
        - "npm test --prefix core"
        - "git diff --check"
      pass_signal: "Root npm test and existing core tests pass from a clean checkout."
    audit_focus:
      - "Root npm test must not depend on current working-directory hacks."
      - "No unrelated package-lock churn unless required and justified."

  - id: C17-M1
    name: "Shared Utils Layer Extraction"
    objective: "Remove duplicated low-level helpers and establish core/src/utils/index.js as shared utility authority."
    covers:
      - ARCH-01
      - utility duplication portion of ARCH-05
    technical_solution:
      - "Create core/src/utils/index.js exporting isPlainObject, cloneJson/deepClone, compactTimestamp, writeYaml/readYaml wrappers, stableStringify, hasText, safeId, and JSONL append helpers where appropriate."
      - "Migrate low-risk call sites first, keeping function semantics identical."
      - "Use js-yaml only after C17-M3; before then writeYaml may wrap existing stringifyYaml to avoid ordering conflicts."
    technical_route:
      - "Introduce utils tests for null/object/array Date/string edge cases."
      - "Migrate repeated helpers in workspace-adjacent, maintenance, project-events, project-notifications, evidence, reviews, storage-sync, sync, rules, lifecycle modules in batches."
      - "Remove local helper definitions when no longer used."
      - "Run duplicate-helper inventory to prove count reduction."
    research_required:
      status: none
      evidence:
        - "Audit found isPlainObject 14 times, clone 6 times, compactTimestamp 8 times, writeYaml 4 times, stableStringify 3 times."
    risks_and_alternatives:
      - "Risk: helper semantics differ subtly; use tests around migrated modules and avoid changing behavior in same patch."
      - "Alternative: leave helper cleanup until after workspace split; rejected because later moves become noisier without shared utilities."
    validation_path:
      owner: test worker
      commands:
        - "node --test core/test/utils.test.js"
        - "npm test"
        - "rg 'function isPlainObject|function compactTimestamp|function stableStringify|async function writeYaml' core/src"
      pass_signal: "Shared utils tests pass, full root tests pass, duplicate helper inventory is substantially reduced or justified."
    audit_focus:
      - "No semantic regression in timestamp formatting or YAML writes."
      - "No circular imports from utils into domain modules."

  - id: C17-M2
    name: "Layered Config And Integration Migration"
    objective: "Remove runtime /home/heyx assumptions and move project/integration paths into layered configuration with explicit migration."
    covers:
      - SEC-01
      - ARCH-03
      - QUAL-02
      - QUAL-04
    technical_solution:
      - "Define layered config schema for integrations.hypo_claw, integrations.hypo_writer, projects[], timezone, and project linkage seeds."
      - "Implement explicit migration command that derives current local settings and writes user-level config only when invoked."
      - "Make sync/start detect missing user-level config and prompt/report migration instructions without silent writes."
      - "Replace hardcoded runtime paths in core/src and scripts with config/env/home-derived values."
    technical_route:
      - "Add config schema tests for project > user > defaults precedence."
      - "Implement config migration helper and CLI route."
      - "Refactor workspace/project-events/scripts to accept injected config and avoid /home/heyx constants in runtime source."
      - "Update docs/examples for config migration."
    research_required:
      status: targeted_local_required
      evidence:
        - "Hardcoded paths found in core/src/workspace/index.js, core/src/project-events/index.js, and scripts/*.sh."
      remaining:
        - "Exact CLI command surface must be confirmed against cli/bin/hypo-workflow during implementation."
    risks_and_alternatives:
      - "Risk: automated migration can expose private local paths; keep it explicit and user-level only."
      - "Risk: scripts still need sane defaults; use HOME-relative and env overrides."
    validation_path:
      owner: test worker
      commands:
        - "node --test core/test/global-config-registry.test.js core/test/project-events.test.js core/test/hypo-claw-notification.test.js"
        - "rg -n '/home/heyx' core/src scripts"
        - "npm test"
      pass_signal: "Runtime source and scripts no longer embed /home/heyx paths except tests/fixtures/docs where explicitly allowed."
    audit_focus:
      - "No silent writes to ~/.hypo-workflow/config.yaml from sync/start."
      - "Migration output redacts raw secrets and does not write repo-local private values."

  - id: C17-M3
    name: "YAML Parser Unification With js-yaml"
    objective: "Replace split partial YAML parsers with a single js-yaml-backed implementation."
    covers:
      - ARCH-04
      - ARCH-06
    technical_solution:
      - "Add js-yaml dependency where package ownership requires it."
      - "Update config parseYaml/stringifyYaml exports to delegate to js-yaml while preserving existing public API."
      - "Update knowledge parsing to use the shared parser and remove parseKnowledgeYaml-specific parser behavior."
      - "Add compatibility fixtures for multiline strings, colons, arrays, nested objects, nulls, and existing knowledge records."
    technical_route:
      - "Add dependency and lockfile changes deliberately."
      - "Build shared YAML wrapper in utils or config with stable dump options."
      - "Migrate config and knowledge modules."
      - "Run broad tests that read .pipeline YAML fixtures."
    research_required:
      status: local_dependency_check_required
      evidence:
        - "Audit says project has node_modules, but package manifests must still declare js-yaml explicitly."
      remaining:
        - "Confirm whether js-yaml already appears transitively before editing package manifests."
    risks_and_alternatives:
      - "Risk: dump formatting changes many snapshots; minimize by controlling line width, sort behavior, and noRefs."
      - "Risk: legacy parser accepted invalid YAML; add migration/error tests."
    validation_path:
      owner: test worker
      commands:
        - "node --test core/test/global-config-registry.test.js core/test/knowledge-ledger.test.js core/test/knowledge-opencode-gate.test.js"
        - "npm test"
      pass_signal: "Config and knowledge YAML behavior is consistent and full root tests pass."
    audit_focus:
      - "No remaining independent parser in knowledge/config."
      - "No silent parse failures for complex YAML."

  - id: C17-M4
    name: "Workspace Clean Module Split"
    objective: "Delete the workspace God Module by moving all responsibilities to explicit modules without compatibility shim."
    covers:
      - ARCH-02
      - QUAL-05
      - workspace-related ARCH-05
    technical_solution:
      - "Create explicit modules: workspace-authority, project-linkage, project-stop-events, codex-capture, notification-sender."
      - "Move implementation and tests to new module-specific imports."
      - "Delete or make private core/src/workspace/index.js; do not leave re-export shim."
      - "Update internal imports in project-events, project-notifications, daily-project-summary, project-linkage-e2e, and docs/examples."
    technical_route:
      - "First add new modules and migrate imports in one coherent patch."
      - "Then remove old workspace import from core/src/index.js and replace barrel exports with explicit namespace or direct module exports."
      - "Run stale import scan as a required check."
    research_required:
      status: none
      evidence:
        - "Direct workspace imports currently found in project-events, project-notifications, daily-project-summary, project-linkage-e2e, and core/src/index.js."
    risks_and_alternatives:
      - "Risk: breaking import cleanup has large blast radius; user explicitly chose one-time clean cut."
      - "Rejected alternative: preserve workspace/index.js re-export shim for one version."
    validation_path:
      owner: test worker
      commands:
        - "node --test core/test/workspace-authority.test.js core/test/project-link-graph.test.js core/test/project-stop-event.test.js core/test/final-assistant-output.test.js core/test/hypo-claw-notification.test.js core/test/project-linkage-registry.test.js"
        - "rg -n 'workspace/index|from .*/workspace' core/src core/test docs README.md README.en.md"
        - "npm test"
      pass_signal: "Old workspace imports are gone, module tests pass, root npm test passes."
    audit_focus:
      - "workspace/index.js must not remain as public compatibility layer."
      - "New modules have clear ownership and no notification/config circular dependency."

  - id: C17-M5
    name: "Ledger JSONL Migration And Barrel Export Cleanup"
    objective: "Fix O(n) ledger rewrites and reduce namespace pollution across the public core exports."
    covers:
      - PERF-01
      - QUAL-01
      - remaining ARCH-05
    technical_solution:
      - "Introduce append-only JSONL ledger helpers and one-time migration from known YAML ledger files."
      - "Generate compact YAML summaries from JSONL for human-readable status surfaces."
      - "Convert project-events, maintenance ledger, project-notifications, daily-summary, and consolidation ledger write paths."
      - "Replace broad core/src/index.js export * surface with explicit or namespace exports where feasible, and update docs/examples."
    technical_route:
      - "Add JSONL utility tests for append, read, corruption handling, and migration idempotency."
      - "Migrate ledger writers one subsystem at a time."
      - "Update tests expecting ledger.yaml content to use JSONL or compact summary paths."
      - "Clean barrel exports and run import/docs scans."
    research_required:
      status: none
      evidence:
        - "Audit identifies O(n) rewrites in project-events, maintenance, project-notifications, daily-project-summary."
    risks_and_alternatives:
      - "Risk: status surfaces may rely on YAML ledger paths; preserve compact YAML summary paths with clear naming."
      - "Risk: broad export cleanup can break external imports; C17 accepts breaking cleanup but docs must update."
    validation_path:
      owner: test worker
      commands:
        - "node --test core/test/project-events.test.js core/test/project-notifications.test.js core/test/daily-project-summary.test.js core/test/maintenance-ledger.test.js"
        - "npm test"
        - "rg -n 'ledger.yaml|export \\* from' core/src core/test docs README.md README.en.md"
      pass_signal: "JSONL ledgers are authoritative for new writes, old YAML migrates once, root tests pass, broad export surface is reduced."
    audit_focus:
      - "No long-term YAML/JSONL dual writes."
      - "Compaction is deterministic and does not drop evidence."
      - "Public docs do not show stale imports or stale ledger authority."

  - id: C17-M6
    name: "Full Audit Closure And Release Readiness"
    objective: "Prove all Critical, Warning, and Info audit items are closed or explicitly deferred with rationale."
    covers:
      - all audit items
      - release regression
    technical_solution:
      - "Run the audit inventory from M0 and compare before/after counts."
      - "Run root npm test, focused changed-module tests, stale import/path/parser/ledger scans, and docs checks."
      - "Generate final C17 audit closure report."
    technical_route:
      - "Collect validation evidence from M0-M5."
      - "Update .pipeline/audits or reports with closure status for each finding."
      - "Update PROJECT-SUMMARY and PROGRESS."
    research_required:
      status: none
    risks_and_alternatives:
      - "Risk: broad cleanup may reveal additional stale docs/tests; treat as C17 blocker unless unrelated."
    validation_path:
      owner: audit worker
      commands:
        - "npm test"
        - "git diff --check"
        - "rg -n '/home/heyx' core/src scripts"
        - "rg -n 'workspace/index|from .*/workspace' core/src core/test docs README.md README.en.md"
        - "rg -n 'function parseYaml|function parseKnowledgeYaml|export \\* from' core/src"
      pass_signal: "Audit closure report shows all C17 targeted findings fixed or explicitly justified."
    audit_focus:
      - "No pseudo-tests; final evidence must be command output backed."
      - "Breaking changes are documented and intentional."
