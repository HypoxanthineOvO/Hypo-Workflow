architecture_constraints:
  - "workspace/index.js must not remain as a compatibility re-export shim after decomposition."
  - "All internal imports and tests must migrate to the new module boundaries in the same Cycle."
  - "Audit must treat stale imports from core/src/workspace/index.js as blockers unless the file is intentionally removed or made non-public."
technical_route_decisions:
  yaml:
    approach: js_yaml_dependency
    rationale: "Avoid maintaining multiple partial YAML parsers and align config/knowledge behavior on a proven parser."
  ledger:
    approach: append_only_jsonl_with_compact_yaml_summary
    rationale: "Use append-only event streams for high-frequency writes while preserving human-readable compact YAML summaries."
  exports:
    approach: broad_cleanup_preferred
    rationale: "Reduce namespace pollution beyond workspace where feasible, while preserving migration clarity through explicit module imports."
  docs:
    approach: update_public_docs_and_examples
    rationale: "Breaking import cleanup must not leave stale examples."
  config_migration:
    approach: explicit_command_plus_sync_start_prompt
    rationale: "Migration is automatic when requested, but sync/start must not silently write user-level config."
  ledger_migration:
    approach: one_time_yaml_to_jsonl
    rationale: "Avoid long-term dual-write behavior while preserving old data through a migration step."
