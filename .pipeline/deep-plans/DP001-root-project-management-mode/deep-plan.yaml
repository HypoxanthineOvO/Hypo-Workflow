ask_rounds:
  -
    asked_at: "2026-05-18T15:36:58+08:00"
    question:
      id: Q001
      challenge: minimum_viable_loop
      question: 这个“根目录项目管理模式”的最小可用闭环到底是什么？
    answer: 用户的核心 Motivation：希望把所有项目都和 Notion 同步，并且后续持续维护同步。纯 Codex 会话不可维护，需要类似 Workflow 的东西管理同步过程，因此需要能在根目录开 Workflow。但普通 Cycle 只适合首次同步这类一次性大工作；后续日常同步不适合反复开 Cycle。单独做同步器又太重。用户提出两个方向：1) 直接给 Workflow 增加中控台，因为项目都用 Workflow，可以在根目录中控台制定同步规则，并设计独立于 Cycle/Patch 的新阶段；2) Workflow 需要一种类似数据维护的数据存储，覆盖“时间上并行、空间上分块”的长期任务，例如不同项目的同步、写作文章维护等。现有代码修改是时间上线性、空间上覆盖整个项目；Hypo-Writer 管理多篇文章时，每改文章都开 Cycle 很不合理。
    unresolved_ambiguity:
      - 根目录 Workflow 是一个真实可执行项目，还是仅作为控制台/聚合器。
      - 日常同步需要写 Notion 远端，属于外部副作用，必须定义确认与审计边界。
      - 文章维护和项目同步是否共享同一种数据模型，还是需要 domain-specific item 模型。
  -
    asked_at: "2026-05-18T15:44:44+08:00"
    question:
      id: Q002
      challenge: essential_vs_habitual
      question: 你真正需要的是“根目录控制台”，还是“Workflow 支持长期维护对象”的通用模式，而根目录控制台只是其中一个入口？
    answer: 用户确认需要后者：Workflow 支持长期维护对象的通用模式。核心需求是维护所有项目的状态，并制定一个与 Notion 里既有项目笔记对接的方案，把本地 Workflow 状态和 Notion 项目笔记同步好。中控台只是一个可能方案，用户尚未确定具体形态，希望继续按第一性原理讨论。
    unresolved_ambiguity:
      - Notion 里已有项目笔记的 schema、字段名和页面组织方式尚未知。
      - 所有项目状态是否都已经由 Hypo-Workflow 管理，还是存在未初始化项目或外部项目。
      - 同步频率是手动按需、定期批量、还是事件触发。
  -
    asked_at: "2026-05-18T15:50:01+08:00"
    question:
      id: Q003
      challenge: falsifying_evidence
      question: 什么情况会证明“通用长期维护对象模式”太重，应该退回到更窄的 Notion 项目同步方案？
    answer: 用户确认同步范围包括进度信息、架构图、prompt、Report、文档等多类 Workflow artifacts。因此这已经不是窄版项目摘要同步，必须做通用维护模式。
    unresolved_ambiguity:
      - 每种 artifact 的大小、更新频率和冲突风险不同，需要分层同步策略。
      - Notion API 对 Mermaid、长文档、代码块和大批量页面更新的限制需要后续调研。
      - 哪些 artifact 是权威源，哪些只是派生投影，必须避免 Notion 回写污染本地 source of truth。
  -
    asked_at: "2026-05-18T15:59:28+08:00"
    question:
      id: Q004
      challenge: minimum_viable_loop
      question: 第一版维护模式必须覆盖哪些 artifact 类型才算闭环：进度、架构、prompt、report、文档全部都要，还是允许先定义全量模型但只实现核心子集？
    answer: 用户确认都要同步：进度信息、架构图、prompt、Report、文档等都要纳入。需要使用 ntn 读取用户 Notion 页面结构，但因为其他用户不一定使用 Notion，所以必须设计通用的存储同步模板；Notion 只是先适配用户当前的页面架构。每个项目有对应页面路径，各自结构可能不同；有些项目前期没有接入 Workflow，需要区分 Workflow-managed、pre-Workflow 和 unmanaged。总体上每个项目要存什么内容大概固定，可以先讨论好。第一轮前几个 Milestone 可以先整理进度锚定页面，后面再逐项确定怎么存。
    unresolved_ambiguity:
      - Notion 页面路径和项目映射规则尚未读取。
      - 不同项目各自页面结构不同，需要区分通用模板和 per-project override。
      - 第一批 Milestone 中“进度锚定页面”是只生成本地 plan/diff，还是允许实际创建/更新 Notion 页面。
  -
    asked_at: "2026-05-18T16:03:36+08:00"
    question:
      id: Q005
      challenge: essential_vs_habitual
      question: 第一版是否仍属于 Deep Research 阶段，以及还有哪些潜在选项？
    answer: 用户确认第一版相当于 Deep Research 阶段任务，认为当前方向没问题，并询问还有哪些潜在选项。
  -
    asked_at: "2026-05-18T16:09:39+08:00"
    question:
      id: Q006
      challenge: minimum_viable_loop
      question: 进度锚定页面的最小固定内容和第一批发现范围是什么？
    answer: 用户确认每个项目应该有一个项目主页：类似 README 的项目介绍，下面按不同分块建立子页面。进度图表可以放在项目主页，具体进度细节放在子页面下，一个 Cycle 一个子页面。Knowledge 等内容在项目主页下面开子页面，并按文件夹结构继续做子页面嵌套。代表性发现范围先把当前 Hypo-Workflow 项目搞上去看看。
  -
    asked_at: "2026-05-18T16:17:27+08:00"
    question:
      id: Q007
      challenge: evidence_gate
      question: 只读读取用户指定 Notion 路径时，当前 ntn integration 是否能看见 Hypoxanthine's Home / Hypo-Projects / Hypo-Workflow？
    answer: 不能。ntn doctor 显示 token 有效且连接到 Hypoxanthine's Notion，但 Notion search 对 Hypoxanthine's Home、Hypo-Projects、Hypo-Workflow、Hypo、空 page-only search 等查询全部返回 0 个页面。当前 evidence 指向 integration 未被分享到目标页面或缺少直接 page id/URL 与访问授权。
    unresolved_ambiguity:
      - 需要用户提供 Hypoxanthine's Home、Hypo-Projects 或 Hypo-Workflow 的 Notion URL/page id，且目标页面需要分享给当前 Notion integration。
      - Storage adapter 需要在 schema discovery 前先报告 access gate 状态，而不是把缺页当成空项目树。
