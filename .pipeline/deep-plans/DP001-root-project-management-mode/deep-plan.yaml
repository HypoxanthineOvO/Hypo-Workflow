deep_plan:
  id: DP001
  slug: root-project-management-mode
  title: 根目录项目管理模式
  status: ready_for_plan
  readiness_depth: conversion_ready
  conversation_summary: 用户将进度锚定页具体化为 Project Home：每个项目有 README-like 项目主页，首页放项目介绍、当前状态和进度图表；具体进度细节在子页面中按 Cycle 组织，一个 Cycle 一个页面；Knowledge/docs 等在项目主页下建立子页面并按本地文件夹结构继续嵌套。Deep Research 第一批试点先聚焦当前 Hypo-Workflow 项目。只读 ntn discovery 已确认用户现有 Notion 结构：Hypoxanthine's Home 是 workspace 根页面，Hypo Projects 是页面列中的 H1 分组，Hypo-Workflow 是该分组下的普通 child page，内容是 Workflow 早期手工 README/路线图/版本设计子页。用户进一步纠正：新同步结构不应简单追加到旧页，也不应新建隔离页，而应整理现有内容并与当前 Workflow artifacts 合并为一个统一 Project Home。用户明确 Project Home 的 canonical storage model：远端存储按内容域划分，时间线只是内容域下面的局部子模块；索引/快捷查询页可以存在，但必须链接回 canonical 内容页。Architecture、Knowledge、Docs 都应是内容域子页面树，而不是单页字段。用户接受 Progress/Architecture/Knowledge/Docs 的第一版职责划分，并确认 Prompts/Reports 按此前方案处理：canonical 内容放在各 Cycle 子页下，同时生成全局索引页链接回 Cycle。已生成中文本地 Notion mapping dry-run 报告，对 87 个顶层 blocks 和 34 个子页进行目标树分类。用户进一步提出根目录既然有全局层，就应纳入全局规则、全局 Secret 引用维护、全局 Knowledge、项目注册表和项目联动关系，使 Workflow 知道有哪些项目、它们如何共享规则/凭据/知识/同步目标。
  package_path: .pipeline/deep-plans/DP001-root-project-management-mode
  summary_path: .pipeline/deep-plans/DP001-root-project-management-mode/summary.md
  plan_context_path: .pipeline/deep-plans/DP001-root-project-management-mode/plan-context.md
  lifecycle_states:
    - drafting
    - researching
    - architecture_mapping
    - module_drilldown
    - ready_for_plan
    - converted
    - archived
  created_at: "2026-05-18T15:24:00+08:00"
  updated_at: "2026-05-18T23:15:30+08:00"
summary: 为 Hypo-Workflow 设计一个新的根目录项目管理模式：在根目录集中管理多个 Workflow 项目的进度、同步、状态摘要和跨项目操作边界。当前阶段只做 Deep Research + Deep Plan，不进入实现。
decisions:
  -
    id: D001
    status: accepted
    statement: C16 先作为 Deep Plan discussion package 运行，不直接生成 implementation milestones。
    rationale: 该功能影响项目 registry、同步、状态表面和跨项目管理边界，必须先明确 source of truth 与安全边界。
  -
    id: D002
    status: accepted
    statement: C16 的问题核心是为 Workflow 增加长期维护/运营态，而不只是根目录项目列表或一次性同步 Cycle。
    rationale: 用户需要管理 Notion 同步、跨项目状态和文章维护这类时间并行、空间分块的持续任务。
  -
    id: D003
    status: proposed
    statement: 首次大规模同步可以仍然走 Cycle；后续日常同步应进入独立于 Cycle/Patch 的维护阶段。
    rationale: Cycle 适合交付闭环，日常同步是持续数据维护，不应消耗交付型 Cycle。
  -
    id: D004
    status: accepted
    statement: C16 的主目标是设计 Workflow 的长期维护对象模式；根目录中控台只是该模式的可选入口或聚合视图。
    rationale: 用户明确需要维护所有项目状态并与 Notion 既有项目笔记对接，而不是先实现某个 UI 方案。
  -
    id: D005
    status: accepted
    statement: Notion 同步应被建模为长期维护模式的首个 domain adapter，而不是 Workflow 内置的唯一目的。
    rationale: 同一模式应能覆盖项目状态维护、文章维护、写作对象维护等空间分块且时间并行的对象。
  -
    id: D006
    status: accepted
    statement: 通用长期维护模式是必要方案；窄版 Notion 项目同步不足以覆盖进度、架构图、prompt、report、文档等多类 Workflow artifacts。
    rationale: 同步对象已经从项目状态摘要扩展为对象状态加 Workflow artifact projection，需要通用 artifact catalog、投影规则和同步 ledger。
  -
    id: D007
    status: accepted
    statement: 全量 artifact 类型都进入维护同步模型：进度、架构图、prompt、report、文档等都要被支持。
    rationale: 用户目标是完整维护项目状态和 Workflow 产物，不是只同步项目摘要。
  -
    id: D008
    status: accepted
    statement: 设计通用 Storage Sync Template；Notion 是首个 storage adapter，用 ntn 只读调研用户现有页面结构后进行映射。
    rationale: 其他用户不一定使用 Notion，核心模型不能绑定 Notion。
  -
    id: D009
    status: accepted
    statement: 项目同步必须区分 Workflow-managed、pre-Workflow 和 unmanaged 项目。
    rationale: 有些项目前期没有接入 Workflow，不能假设所有项目都有完整 .pipeline/Cycle/Report 结构。
  -
    id: D010
    status: accepted
    statement: C16 第一批 Milestone 应先建立进度锚定页面，再逐类确定 artifact 的存储与投影方式。
    rationale: 进度锚定页面为所有项目建立可维护入口，后续 artifact 同步可以逐步挂载到该入口。
  -
    id: D011
    status: accepted
    statement: C16 第一批工作应定位为 Deep Research / mapping / dry-run 阶段，而不是立即进入真实 Notion 写入或完整实现。
    rationale: 需要先读取 Notion 页面结构、定义通用存储模板、进度锚定页和 artifact 投影方案。
  -
    id: D012
    status: accepted
    statement: 每个项目的进度锚定页应升级为 Project Home：README-like 项目主页 + artifact domain 子页面树。
    rationale: 项目主页承载项目介绍和高层状态，细节内容按进度、Cycle、Knowledge、文档等域继续分层。
  -
    id: D013
    status: accepted
    statement: 进度图表可放在 Project Home，进度细节按 Cycle 子页面组织，一个 Cycle 一个子页面。
    rationale: 首页保持概览，Cycle 细节可独立维护和逐步同步。
  -
    id: D014
    status: accepted
    statement: Knowledge 和文档类 artifact 在 Project Home 下建立子页面，并按本地文件夹结构继续嵌套。
    rationale: 这保持本地 artifact 结构和远端阅读结构的可追踪关系。
  -
    id: D015
    status: accepted
    statement: Deep Research 第一批 Notion/Storage 试点范围先聚焦当前 Hypo-Workflow 项目。
    rationale: 当前项目 artifact 最完整，适合验证 Project Home、Cycle 子页和 artifact tree 模板。
  -
    id: D016
    status: accepted
    statement: Notion discovery 必须把 integration 可见范围作为显式 access gate；搜索不到页面时不能继续盲扫或假设路径存在。
    rationale: ntn token 已认证但当前 integration 搜索不到任何页面，说明 Storage Sync Template 需要表达 not_shared / missing_scope / direct_ref_required 等发现状态。
  -
    id: D017
    status: accepted
    statement: 当前 Hypo-Workflow 的 Notion 既有页应进入整理与合并流程：以现有内容为 legacy corpus，与当前 Workflow artifacts 重组为同一个统一 Project Home，而不是简单追加分区或新建隔离子页。
    rationale: 用户明确否定“追加末尾”和“新建子页”两种方案；目标是把早期手工项目笔记和现代 Workflow 状态同步到一个可维护的信息架构中。
  -
    id: D018
    status: accepted
    statement: Notion 同步第一版需要 Legacy Reconciliation 模型，包含 discover、classify、map、merge-plan、dry-run、apply、verify、record，而不仅是 artifact projection。
    rationale: 既有页面不是空目标，也不是只读参考；它包含需要保留、重排、合并和可能迁移的知识资产。
  -
    id: D019
    status: accepted
    statement: 统一 Project Home 的 canonical 信息架构按内容域组织；时间线只作为内容域内部的子模块，例如每个 Cycle 子页内按时间顺序组织 Prompts 和 Reports。
    rationale: 用户明确远端存储时应按内容划分，时间线不是顶层组织原则；为了检索可额外建立索引/快捷页，但索引必须链接回 canonical 内容页。
  -
    id: D020
    status: accepted
    statement: Architecture、Knowledge、Docs 都是 Project Home 下的 canonical 子页面树；每个域内部可以继续按文件夹、主题、图表或文档类型嵌套。
    rationale: 用户明确 Arch、Knowledge 和 Docs 都要有子页面；这避免把复杂内容压成单页字段，也为旧 Notion 内容和本地 artifact 合并提供稳定挂载点。
  -
    id: D021
    status: accepted
    statement: 第一版 Project Home 子树固定为内容域职责页：Progress 包含项目进度总览、Cycle 列表、待同步/待整理事项；Architecture 包含当前架构、架构图、关键决策、旧设计整理；Knowledge 存经验/规则/参考；Docs 按 User Docs、Developer Docs、Specs、Release Docs 分类。
    rationale: 用户确认这些页面职责都没问题，Docs 采用分类式组织。
  -
    id: D022
    status: accepted
    statement: Prompts 和 Reports 的 canonical 内容放在对应 Cycle 子页下；全局 Prompts/Reports 页面只作为索引/检索视图，链接回各 Cycle 的 canonical 页面。
    rationale: 用户确认采用此前方案；这保持时间顺序在 Cycle 内部，同时保留跨 Cycle 检索入口。
  -
    id: D023
    status: accepted
    statement: 根目录项目管理模式需要一个高于单项目 Project Home 的 Global Workspace 层，负责项目注册、跨项目联动、全局规则、全局 Knowledge、Secret 引用和全局同步目标。
    rationale: 用户指出既然进入全局模式，就不能只设计单项目 Notion 同步；系统需要知道有哪些项目可以联动，以及全局层有哪些可维护对象。
  -
    id: D024
    status: accepted
    statement: Global Secret 维护需要允许 raw key 存在于全局本地 secret store，例如未来的 `~/.hypo-workflow/secrets.yaml` 或等价 OS/keychain 后端；仓库、Knowledge Ledger、Project Home 和 Notion 只保存/同步 secret reference、用途、依赖项目、可用性健康状态和 redaction policy。
    rationale: 用户明确需要维护 raw key，但不能进入仓库；现有 Knowledge spec 已要求仓库记录不得保存 raw secret values，根目录模式需要把本地 secret store 与可同步 projection 严格分离。
  -
    id: D025
    status: proposed
    statement: 第一版 Global Workspace 应包含 Workspace Home、Project Registry、Project Link Graph、Global Rules、Global Secret References、Global Knowledge Index、Sync Targets 和 Maintenance Queue 八类页面/对象。
    rationale: 这些对象覆盖“知道有哪些项目”“项目如何联动”“共享哪些规则/知识/凭据引用”“哪些内容要同步”和“接下来要执行什么维护动作”的最小闭环。
  -
    id: D026
    status: accepted
    statement: 第一版 Global Workspace 的 source of truth 采用 `~/.hypo-workflow/workspace.yaml`；现有 `~/.hypo-workflow/projects.yaml` 保持为 Global TUI / project switcher 的轻量派生兼容视图，`~/.hypo-workflow/maintenance/` 存放维护队列、ledger、cache 和 dry-run/apply 证据。
    rationale: Global Workspace 是用户级长期维护对象，不应绑定到某个项目仓库；现有 `projects.yaml` 已被规范和实现为项目摘要列表，不适合承载 Notion binding、关系图、全局规则、Secret 引用、Knowledge 聚合和维护队列。
  -
    id: D027
    status: accepted
    statement: 第一版 Global Secret Store 使用 `~/.hypo-workflow/secrets.yaml` 作为 raw value authority，支持 global/workspace/project 分层，存储 LLM API Key/Base URL、Notion token、微信公众号 token、Hypo-Claw API 等可用凭据；Agent 可以读取并用于任务集成。
    rationale: 用户需要一个可用型 secret store，让后续任务可以直接发现并使用 LLM、Notion、发布渠道和 Hypo-Claw 等外部服务能力，而不是只存不可用的引用。
  -
    id: D028
    status: accepted
    statement: Agent 读取、迁移或 health check raw secret 时需要写审计事件，但审计事件、workspace projection、Notion、Knowledge、报告、diff 和 log 不得保存 raw value；raw value 只能留在 `secrets.yaml` 或未来等价 secure backend。
    rationale: 这同时满足用户希望 Agent 可读可用的要求，以及此前 raw key 不进入仓库/同步层的硬边界。
  -
    id: D029
    status: accepted
    statement: "`~/.hypo-workflow/secrets.yaml` 第一版不加密，但必须要求本地文件权限 `0600`，并继续禁止 raw value 进入仓库或同步层。"
    rationale: 用户明确表示不用加密；本地个人使用场景下先用文件权限保护，后续可抽象 backend 而不改变同步层 redaction 边界。
  -
    id: D030
    status: accepted
    statement: Agent 在任务匹配 secret capability / allowed_for 时可以自动读取 raw secret，不需要每次另行询问；读取仍需审计且不得回显 raw value。
    rationale: 用户希望后续任务能直接拿全局 LLM、Notion、发布和 Hypo-Claw API 集成使用；capability match 是最小自动授权边界。
  -
    id: D031
    status: accepted
    statement: Secret health check 默认使用真实 provider 调用，只记录脱敏状态、时间、checker 和摘要。
    rationale: 用户确认使用真实调用；这能验证凭据实际可用，同时避免请求/响应中的敏感值进入日志。
  -
    id: D032
    status: accepted
    statement: Hypo-Claw API 第一版允许通知任务完成/报告就绪、读状态、拉任务和同步报告。
    rationale: 用户明确这些能力都允许；Secret Store 需要把 Hypo-Claw 建模为完整维护集成，而不是单向通知 webhook。
  -
    id: D033
    status: accepted
    statement: "`Hypo-Info` 旧版应归档为 legacy/predecessor，`Hypo-Info-V2` 是当前 canonical 项目。"
    rationale: 用户明确说明旧 Hypo-Info 做得有问题，现在应以 Hypo-Info-V2 为准。
  -
    id: D034
    status: accepted
    statement: "`Hypo-Agent` 是 `Hypo-Claw` 的前身，应归档为 legacy/predecessor，`Hypo-Claw` 是当前 canonical 项目。"
    rationale: 用户明确说明 Hypo-Claw 的旧前身是 Hypo-Agent，后续同步不能把旧页当作当前 Project Home。
  -
    id: D035
    status: accepted
    statement: DR005/DR006 样本集合采用 `Hypo-Info-V2/Hypo-Info`、`Hypo-Claw/Hypo-Agent`、`Hypo-GPU`、`Hypo-Image` 和压力样本 `Hypo-Writer`。
    rationale: 该集合覆盖 successor/legacy、local-only current、pre-Workflow、Notion-only/skill-backed、long-running writing maintenance 五类情况。
  -
    id: D036
    status: accepted
    statement: DR005 证明 Storage Sync Template 至少需要四类对象形态：current Workflow project with legacy predecessor、pre-Workflow manual project、skill/service object、legacy project corpus。
    rationale: 代表性 Notion 页面显示旧项目页、手工里程碑页、skill/service 文档页和当前项目 successor 不能用同一套 Project-only 假设处理。
  -
    id: D037
    status: accepted
    statement: DR006 证明 Artifact Catalog 必须记录 freshness、parseability、authority、sensitivity 和 relation provenance；派生产物可能相对 state/continuation 过期。
    rationale: 样本中 `PROJECT-SUMMARY.md`、`PROGRESS.md`、旧 state 格式和缺失 `.pipeline` 都会导致错误判断，必须在 catalog 层显式表达。
  -
    id: D038
    status: accepted
    statement: Global Knowledge v1 采用 global authored records + per-project compact/index derived aggregation；项目 raw Knowledge 不被全局层或 Notion 默认复制。
    rationale: 这满足跨项目知识检索和联动需求，同时避免上下文膨胀、重复过期和 secret ref 泄漏。
  -
    id: D039
    status: accepted
    statement: Project Link Graph 的 typed edges 由 `workspace.yaml` 掌权；Project Registry 只负责对象身份，Knowledge/Notion/Project Home 都是关系投影面。
    rationale: 关系与对象身份分离可以避免 registry 和 graph 双 source-of-truth。
  -
    id: D040
    status: accepted
    statement: 同步必须从第一版支持字段级 authority/conflict matrix；Notion 是 projection 与 legacy corpus 面，不能覆盖当前 Workflow 状态、prompt、report、rules、raw secrets 或 ledger。
    rationale: DR005/DR006 显示远端旧页和本地当前状态经常不同步，没有字段级权威会污染当前 source of truth。
  -
    id: D041
    status: accepted
    statement: Maintenance Queue v1 位于 `~/.hypo-workflow/maintenance/`，以 scan/diff/dry-run/apply/verify/record lifecycle 管理日常维护，并按 side-effect level 门控外部写入。
    rationale: 日常维护是多对象长期并行操作，不应塞进线性 Cycle，也不能让远端写入绕过 dry-run 和验证。
  -
    id: D042
    status: accepted
    statement: Global Rules v1 读取 structured global/project/cycle rules 并生成有效规则矩阵；Notion 只展示规则和冲突，不作为规则编辑 authority。
    rationale: Structured rules 是规则权威，Markdown/adapters/Notion 都应是派生视图。
  -
    id: D043
    status: accepted
    statement: Deep Research 已足够转普通 `/hw:plan`；推荐第一版实现停在 local schema + scanner + dry-run + queue/ledger，不直接做真实 Notion apply。
    rationale: 真实 Notion 写入属于外部副作用，应该等本地 dry-run 和 merge plan 经用户审阅后再加显式 apply gate。
  -
    id: D044
    status: accepted
    statement: 第一版实现应包含真实 Notion apply path，但必须放在最后；先完成 schema/scanner/dry-run/merge plan/queue ledger，并在完整方案审核后通过显式 apply 确认门控再写远端。
    rationale: 用户希望最终做真实同步，而不是只停留在 dry-run；但真实写入必须延后到方案审阅和显式确认之后。
