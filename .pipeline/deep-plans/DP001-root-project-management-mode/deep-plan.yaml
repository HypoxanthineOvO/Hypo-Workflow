intentional_blanks:
  -
    id: options-matrix
    reason: Deep Research 阶段先保留选项矩阵，不急于进入 implementation-ready decomposition。
    options:
      -
        id: O1
        axis: storage_backend_scope
        option: Notion-first generic template
        description: 先为 Notion 落地，但所有设计写成 storage adapter/template contract。
        tradeoff: 最贴近用户当前需求，同时保留其他后端空间；需要克制 Notion 特有假设。
        recommendation: recommended
      -
        id: O2
        axis: storage_backend_scope
        option: Pure abstract storage layer first
        description: 先不碰 Notion，完整设计通用 storage API。
        tradeoff: 架构干净，但可能脱离真实页面结构，容易过度抽象。
        recommendation: not_first
      -
        id: O3
        axis: sync_direction
        option: Local authoritative projection
        description: Workflow 本地 artifact 是权威源，Notion 只作为投影/阅读/检索空间。
        tradeoff: 审计链安全，适合 progress/prompt/report/docs；Notion 编辑不自动回写。
        recommendation: recommended_default
      -
        id: O4
        axis: sync_direction
        option: Field-level bidirectional sync
        description: 部分字段允许 Notion 回写，部分字段保持本地权威。
        tradeoff: 更强，但冲突策略复杂；适合后续在项目 metadata/状态备注上引入。
        recommendation: later_or_selected_fields
      -
        id: O5
        axis: execution_boundary
        option: Dry-run first, apply later
        description: Deep Research 阶段只生成 schema map、page plan、diff，不写 Notion。
        tradeoff: 安全、可审查；需要后续 Milestone 才能证明写入路径。
        recommendation: recommended_for_deep_research
      -
        id: O6
        axis: execution_boundary
        option: Sandbox page apply
        description: 允许写入一个用户指定沙盒页面验证 block/页面结构。
        tradeoff: 能早发现 API/格式限制；需要明确远端写入授权和隔离页。
        recommendation: optional_after_discovery
      -
        id: O7
        axis: page_model
        option: Progress anchor as root per project
        description: 每项目一个稳定锚定页，artifact slots 挂在该页或其子页面下。
        tradeoff: 认知稳定，适合后续逐类扩展；要求先定义固定区块。
        recommendation: recommended
      -
        id: O8
        axis: page_model
        option: Artifact-native pages without anchor
        description: 每类 artifact 直接创建独立页面或数据库记录，不强制项目锚定页。
        tradeoff: 简单直接，但跨项目浏览和维护状态会分散。
        recommendation: not_first
      -
        id: O9
        axis: project_adoption
        option: Three-tier adoption model
        description: Workflow-managed / pre-Workflow / unmanaged 三类项目，分别定义可用 artifact 和缺失表达。
        tradeoff: 符合现实项目状态；需要清晰分类规则。
        recommendation: recommended
      -
        id: O10
        axis: research_scope
        option: Portfolio-wide discovery
        description: ntn 扫描所有项目页面结构并生成全局 map。
        tradeoff: 全局视野强，但范围大、权限和噪声风险高。
        recommendation: later_or_bounded
      -
        id: O11
        axis: research_scope
        option: Representative subset discovery
        description: 先选 2-3 个代表性项目：完整 Workflow 项目、pre-Workflow 项目、页面结构特殊项目。
        tradeoff: 范围可控，能验证分类和模板；需要用户挑选入口。
        recommendation: recommended
      -
        id: O12
        axis: global_workspace_scope
        option: Workspace layer above Project Home
        description: 先建立 Workspace Home、Project Registry、Project Link Graph、Global Rules、Global Secret References、Global Knowledge Index、Sync Targets 和 Maintenance Queue 的本地 dry-run 模型，再决定哪些投影到 Notion。
        tradeoff: 能覆盖全局规则/Secret/Knowledge/项目联动，但需要明确哪些是本地权威、哪些只是远端可读投影。
        recommendation: recommended
risks:
  -
    id: R007
    statement: 把根目录控制台和 Notion 同步耦合过紧，会让其他长期维护域（文章、数据集、发布渠道）难以复用。
  -
    id: R008
    statement: Notion 同步范围包含长文档、prompt 和 report 后，性能、分页、API 限制和可读性可能成为第一版风险。
  -
    id: R009
    statement: 如果不区分 source artifact 与 derived projection，可能让 Notion 内容反向污染 Workflow 审计记录。
  -
    id: R010
    statement: Notion 页面结构各项目不同，若无通用 storage template 和 per-project mapping，会很快变成一次性脚本。
  -
    id: R011
    statement: pre-Workflow/unmanaged 项目缺少本地 artifact，若不显式建模会导致同步结果看似缺失或错误。
  -
    id: R012
    statement: ntn 读取真实 Notion 结构是远端只读操作，需要后续明确范围和凭据边界。
  -
    id: R013
    statement: Notion integration 可能只被授予局部页面访问；如果 discovery 不显式区分权限不可见和页面不存在，会生成错误的空映射。
  -
    id: R014
    statement: 如果全局层直接复制各项目 raw Knowledge/Docs，会导致上下文膨胀、重复和过期；第一版应聚合 compact/index 和链接。
  -
    id: R015
    statement: 如果 Secret 维护没有严格区分 reference 与 value，Notion 同步和 Knowledge 索引可能造成凭据泄漏。
  -
    id: R016
    statement: 如果 Project Registry 与 Project Link Graph 都可手写且互相覆盖，会出现跨项目关系的双 source-of-truth。
