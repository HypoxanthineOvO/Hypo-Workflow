  -
    id: T009
    title: Global Workspace 与跨项目联动层
    type: requirement
    status: active
    questions:
      - 全局层哪些对象应该同步到 Notion，哪些只保留在本地：规则、Secret 引用、Knowledge、项目关系、同步队列？
      - 项目联动关系第一版应表达哪些关系：depends_on、related_to、shares_rules、shares_secret_ref、shares_knowledge、syncs_to？
      - "`workspace.yaml` 的第一版 schema 如何从 DR001/DR002 的项目对账和分类结果生成 draft？"
    decisions:
      -
        id: D023
        status: accepted
        statement: 根目录项目管理模式需要一个 Global Workspace 层，覆盖项目注册、跨项目联动、全局规则、全局 Knowledge、Secret 引用和同步目标。
      -
        id: D024
        status: accepted
        statement: Secret 维护允许 raw key 存在于全局本地 secret store，但可同步层只记录引用和健康状态。
      -
        id: D025
        status: proposed
        statement: 第一版 Global Workspace 候选对象为 Workspace Home、Project Registry、Project Link Graph、Global Rules、Global Secret References、Global Knowledge Index、Sync Targets 和 Maintenance Queue。
      -
        id: D026
        status: accepted
        statement: 第一版 Global Workspace 的 source of truth 采用 `~/.hypo-workflow/workspace.yaml`；`projects.yaml` 只作为派生兼容视图，maintenance 目录保存队列、ledger、cache 和证据。
      -
        id: D027
        status: accepted
        statement: 第一版 Global Secret Store 使用 `~/.hypo-workflow/secrets.yaml` 作为 raw value authority，支持分层和可用凭据，Agent 可以读取并用于任务集成。
      -
        id: D028
        status: accepted
        statement: Agent 读取、迁移或 health check raw secret 时需要写审计事件；仓库、Notion、Knowledge、报告、diff 和 log 不得保存 raw value。
      -
        id: D029
        status: accepted
        statement: "`secrets.yaml` 第一版不加密但要求 `0600`；任务匹配 capability 时 Agent 可自动读取 raw secret；health check 默认真实调用；Hypo-Claw 允许通知、读状态、拉任务和同步报告。"
    risks:
      -
        id: R014
        statement: 如果全局层直接复制各项目 raw Knowledge/Docs，会导致上下文膨胀、重复和过期；第一版应聚合 compact/index 和链接。
      -
        id: R015
        statement: 如果 Secret 维护没有严格区分 reference 与 value，Notion 同步和 Knowledge 索引可能造成凭据泄漏。
      -
        id: R016
        statement: 如果 Project Registry 与 Project Link Graph 都可手写且互相覆盖，会出现跨项目关系的双 source-of-truth。
    relationships:
      depends_on:
        - object-registry
        - policy-engine
        - storage-template
      blocks:
        - ordered_feature_queue:F001
        - ordered_feature_queue:F002
      conflicts_with:
        - root-entry-as-only-source-of-truth
      feeds_into_plan:
        - ordered_feature_queue:F001
        - ordered_feature_queue:F004
    evidence_refs:
      - "user-global-layer-2026-05-18T18:06:57+08:00"
      - "references/config-spec.md:310"
      - "references/knowledge-spec.md:96"
architecture:
  components:
    -
      id: maintenance-mode
      title: 长期维护模式
      description: 独立于 Cycle/Patch 的长期对象维护 lifecycle，负责 scan、diff、plan、apply、verify、record。
      evidence_refs:
        - "user-confirmation-2026-05-18T15:44:44+08:00"
    -
      id: object-registry
      title: 维护对象注册表
      description: 记录 Project、Article、SyncTarget 等维护对象的本地身份、远端引用和当前状态。
      evidence_refs:
        - "user-confirmation-2026-05-18T15:44:44+08:00"
    -
      id: object-ledger
      title: 对象级 Ledger
      description: 保存对象维护历史、同步事件、冲突处理和验证证据。
      evidence_refs:
        - "user-confirmation-2026-05-18T15:44:44+08:00"
    -
      id: policy-engine
      title: 维护规则与字段权威
      description: 定义哪些字段由本地 Workflow 权威、哪些字段由 Notion 权威，以及冲突策略。
      evidence_refs:
        - "user-confirmation-2026-05-18T15:44:44+08:00"
    -
      id: operation-queue
      title: 维护操作队列
      description: 将日常维护表达为可审计操作：scan、diff、dry-run、apply、verify、record。
      evidence_refs:
        - "user-confirmation-2026-05-18T15:44:44+08:00"
    -
      id: notion-adapter
      title: Notion Domain Adapter
      description: 首个维护域适配器，负责读取/写入 Notion 既有项目笔记并生成 diff。
      evidence_refs:
        - "user-confirmation-2026-05-18T15:44:44+08:00"
    -
      id: root-entry
      title: 根目录入口/中控台
