components:
  -
    id: maintenance-mode
    title: 长期维护模式
    description: 独立于 Cycle/Patch 的长期对象维护 lifecycle，负责 scan、diff、plan、apply、verify、record。
    evidence_refs:
      - "user-confirmation-2026-05-18T15:44:44+08:00"
  -
    id: object-registry
    title: 维护对象注册表
    description: 记录 Project、Article、SyncTarget 等维护对象的本地身份、远端引用和当前状态。
    evidence_refs:
      - "user-confirmation-2026-05-18T15:44:44+08:00"
  -
    id: object-ledger
    title: 对象级 Ledger
    description: 保存对象维护历史、同步事件、冲突处理和验证证据。
    evidence_refs:
      - "user-confirmation-2026-05-18T15:44:44+08:00"
  -
    id: policy-engine
    title: 维护规则与字段权威
    description: 定义哪些字段由本地 Workflow 权威、哪些字段由 Notion 权威，以及冲突策略。
    evidence_refs:
      - "user-confirmation-2026-05-18T15:44:44+08:00"
  -
    id: operation-queue
    title: 维护操作队列
    description: 将日常维护表达为可审计操作：scan、diff、dry-run、apply、verify、record。
    evidence_refs:
      - "user-confirmation-2026-05-18T15:44:44+08:00"
  -
    id: notion-adapter
    title: Notion Domain Adapter
    description: 首个维护域适配器，负责读取/写入 Notion 既有项目笔记并生成 diff。
    evidence_refs:
      - "user-confirmation-2026-05-18T15:44:44+08:00"
  -
    id: root-entry
    title: 根目录入口/中控台
    description: 可选聚合入口，展示对象状态、同步队列、阻塞项和跨项目维护摘要。
    evidence_refs:
      - "user-confirmation-2026-05-18T15:44:44+08:00"
  -
    id: artifact-catalog
    title: Workflow Artifact Catalog
    description: 登记进度、架构图、prompt、report、文档等 artifact 的类型、权威源、更新频率、大小和同步策略。
    evidence_refs:
      - "user-artifact-scope-2026-05-18T15:50:01+08:00"
  -
    id: projection-engine
    title: Artifact Projection Engine
    description: 将不同 artifact 按规则投影到 Notion 字段、页面正文、子页面、索引或链接，并生成 diff。
    evidence_refs:
      - "user-artifact-scope-2026-05-18T15:50:01+08:00"
  -
    id: storage-template
    title: Storage Sync Template
    description: 通用存储同步模板，描述 page tree、artifact slots、record schema、operation protocol 和 backend adapter contract。
    evidence_refs:
      - "user-storage-template-2026-05-18T15:59:28+08:00"
  -
    id: progress-anchor
    title: Project Progress Anchor Page
    description: 每个项目的稳定锚定页面，承载当前进度、同步索引、artifact slots、阻塞项和后续链接。
    evidence_refs:
      - "user-progress-anchor-2026-05-18T15:59:28+08:00"
  -
    id: project-adoption-classifier
    title: Project Adoption Classifier
    description: 区分 Workflow-managed、pre-Workflow 和 unmanaged 项目，并决定可用 artifact 与缺失项处理。
    evidence_refs:
      - "user-progress-anchor-2026-05-18T15:59:28+08:00"
  -
    id: ntn-discovery
    title: ntn Notion Structure Discovery
    description: 后续只读读取用户 Notion 页面/数据库结构，生成 storage mapping draft，不直接写远端。
    evidence_refs:
      - "ntn-help-2026-05-18T15:59:28+08:00"
  -
    id: project-home
    title: Project Home Page
    description: 每个项目的 README-like 主页，承载项目介绍、当前状态、进度图表、artifact/domain 子页面入口和同步状态。
    evidence_refs:
      - "user-page-tree-2026-05-18T16:09:39+08:00"
  -
    id: cycle-page-tree
    title: Cycle Progress Page Tree
    description: Project Home 下的进度细节子树，一个 Cycle 一个子页面，首页只保留进度图表/摘要。
    evidence_refs:
      - "user-page-tree-2026-05-18T16:09:39+08:00"
  -
    id: knowledge-doc-tree
    title: Knowledge And Docs Page Tree
    description: Project Home 下的 Knowledge/docs 子树，按本地文件夹结构继续嵌套并保留源路径映射。
    evidence_refs:
      - "user-page-tree-2026-05-18T16:09:39+08:00"
  -
    id: current-project-pilot
    title: Hypo-Workflow Current Project Pilot
    description: Deep Research 首个试点对象：当前 Hypo-Workflow 项目，用于生成 Project Home dry-run 和页面树映射。
    evidence_refs:
      - "user-current-project-pilot-2026-05-18T16:09:39+08:00"
  -
    id: global-workspace
    title: Global Workspace Layer
    description: 位于单项目 Project Home 之上的全局维护层，聚合项目注册、跨项目关系、全局规则、全局 Knowledge、Secret 引用、同步目标和维护队列。
    evidence_refs:
      - "user-global-layer-2026-05-18T18:06:57+08:00"
  -
    id: project-link-graph
    title: Project Link Graph
    description: 记录项目之间的联动关系，例如依赖、相关、共享规则、共享 Secret 引用、共享 Knowledge 和共同同步目标。
    evidence_refs:
      - "user-global-layer-2026-05-18T18:06:57+08:00"
  -
    id: global-rules-registry
    title: Global Rules Registry
    description: 维护全局规则/习惯、项目覆盖关系和最终生效规则摘要，并向各项目 Project Home 提供链接。
    evidence_refs:
      - "references/config-spec.md:623"
  -
    id: global-secret-refs
    title: Global Secret References
    description: 管理全局本地 raw key store `~/.hypo-workflow/secrets.yaml`；第一版不加密但要求 `0600`，Agent 可在任务匹配 capability 时自动读取 raw value；向仓库/Notion/Knowledge 只投影 provider、环境变量名、用途、依赖项目、健康状态和 redaction policy，raw key 不进入可同步层。
    evidence_refs:
      - "references/knowledge-spec.md:96"
      - ".pipeline/deep-plans/DP001-root-project-management-mode/global-secret-store-schema.md"
  -
    id: global-knowledge-index
    title: Global Knowledge Index
    description: 聚合各项目 Knowledge compact/index 和跨项目经验，不复制所有 raw records，提供跨项目检索入口。
    evidence_refs:
      - "references/knowledge-spec.md:84"
  -
    id: global-sync-targets
    title: Global Sync Targets
    description: 记录 Notion 等 storage backend 的 workspace/page/database 映射、项目页面路径、同步状态和 access gate。
    evidence_refs:
      - "user-storage-template-2026-05-18T15:59:28+08:00"
  -
    id: workspace-authority
    title: Workspace Authority Manifest
    description: 用户级 `~/.hypo-workflow/workspace.yaml`，作为 Global Workspace 的对象身份、项目纳入、远端绑定、关系图、sync target、secret refs 和 policy refs 权威来源。
    evidence_refs:
      - ".pipeline/deep-plans/DP001-root-project-management-mode/global-workspace-source-of-truth.md"
  -
    id: projects-derived-view
    title: Projects Derived View
    description: 现有 `~/.hypo-workflow/projects.yaml`，继续服务 Global TUI 和 project switcher；只保留项目状态摘要，不承载 Global Workspace authority。
    evidence_refs:
      - "references/config-spec.md:310"
      - ".pipeline/deep-plans/DP001-root-project-management-mode/global-workspace-source-of-truth.md"
  -
    id: maintenance-evidence-store
    title: Maintenance Evidence Store
    description: 用户级 `~/.hypo-workflow/maintenance/`，保存维护队列、ledger、cache、dry-run/apply/verify 证据；不塞进 workspace manifest。
    evidence_refs:
      - ".pipeline/deep-plans/DP001-root-project-management-mode/global-workspace-source-of-truth.md"
edges:
  -
    from: maintenance-mode
    to: object-registry
    relationship: owns lifecycle for
    reason: 长期维护模式需要知道要维护哪些对象。
  -
    from: object-registry
    to: object-ledger
    relationship: records events in
    reason: 对象状态变化必须可追踪。
  -
    from: policy-engine
    to: operation-queue
    relationship: gates
    reason: 外部写入和冲突处理必须先经过规则判断。
  -
    from: notion-adapter
    to: operation-queue
    relationship: produces diffs for
    reason: Notion 同步先生成 diff/dry-run，再进入 apply。
  -
    from: root-entry
    to: object-registry
    relationship: reads
    reason: 中控台只是入口，不应成为 source of truth。
  -
    from: root-entry
    to: operation-queue
    relationship: displays and dispatches
    reason: 用户从根目录查看和确认待执行维护操作。
  -
    from: maintenance-mode
    to: artifact-catalog
    relationship: scans
    reason: 维护模式必须发现和分类需要同步的 Workflow artifacts。
  -
    from: artifact-catalog
    to: policy-engine
    relationship: feeds policy
    reason: 不同 artifact 需要不同 authority、冲突和投影策略。
  -
    from: artifact-catalog
    to: projection-engine
    relationship: provides artifacts to
    reason: 投影引擎根据 artifact 类型选择 Notion 表达方式。
  -
    from: projection-engine
    to: notion-adapter
    relationship: hands off changes to
    reason: Notion adapter 只负责具体远端读写，投影规则不应散落在 adapter 内。
  -
    from: projection-engine
    to: operation-queue
    relationship: produces artifact diffs for
    reason: artifact 同步也必须 dry-run/diff 后再 apply。
  -
    from: storage-template
    to: projection-engine
    relationship: defines slots for
    reason: 投影引擎根据通用 slots 生成后端特定写入计划。
  -
    from: storage-template
    to: notion-adapter
    relationship: is implemented by
    reason: Notion adapter 是 storage template 的首个后端实现。
  -
    from: ntn-discovery
    to: storage-template
    relationship: discovers mapping for
    reason: ntn 只读发现用户现有页面结构，并生成模板映射草案。
  -
    from: project-adoption-classifier
    to: artifact-catalog
    relationship: filters available artifacts for
    reason: 未接入 Workflow 的项目缺少 prompt/report/progress 等 artifact。
  -
    from: progress-anchor
    to: artifact-catalog
    relationship: anchors artifact index for
    reason: 进度锚定页为所有后续 artifact 同步提供稳定挂载点。
  -
    from: root-entry
    to: progress-anchor
    relationship: summarizes
    reason: 根目录入口聚合每个项目的锚定页状态。
  -
    from: progress-anchor
    to: project-home
    relationship: becomes
    reason: 进度锚定页应升级为项目主页，而不只是进度页。
  -
    from: project-home
    to: cycle-page-tree
    relationship: contains
    reason: Cycle 进度细节按子页面组织。
  -
    from: project-home
    to: knowledge-doc-tree
    relationship: contains
    reason: Knowledge/docs 按域和文件夹结构挂载在项目主页下。
  -
    from: artifact-catalog
    to: project-home
    relationship: indexes into
    reason: Project Home 提供 artifact/domain 入口。
  -
    from: current-project-pilot
    to: project-home
    relationship: validates template with
    reason: 当前 Hypo-Workflow 项目用于第一轮模板验证。
  -
    from: ntn-discovery
    to: current-project-pilot
    relationship: discovers target for
    reason: 后续 ntn 只读调研先限定到当前项目对应 Notion 页面。
  -
    from: global-workspace
    to: object-registry
    relationship: owns global view of
    reason: 全局层需要知道有哪些项目、文章、同步目标和维护对象。
  -
    from: global-workspace
    to: project-home
    relationship: links to
    reason: Workspace Home 是入口，Project Home 是单项目 canonical 内容页。
  -
    from: global-workspace
    to: project-link-graph
    relationship: contains
    reason: 跨项目联动需要单独建模，不能只靠项目列表。
  -
    from: project-link-graph
    to: object-registry
    relationship: annotates relationships between
    reason: 关系图需要引用稳定项目 id 和维护对象 id。
  -
    from: global-rules-registry
    to: policy-engine
    relationship: provides policy inputs to
    reason: 全局规则和项目覆盖关系影响同步、写入、权限和输出边界。
  -
    from: global-secret-refs
    to: policy-engine
    relationship: constrains
    reason: Secret 只能以引用和 redacted health 状态参与同步计划。
  -
    from: global-knowledge-index
    to: root-entry
    relationship: surfaces in
    reason: 根目录入口需要展示跨项目可复用知识和关联项目。
  -
    from: global-sync-targets
    to: storage-template
    relationship: configures backend mappings for
    reason: 通用 Storage Sync Template 需要知道各项目对应的后端路径与 access gate。
  -
    from: global-sync-targets
    to: notion-adapter
    relationship: provides target refs to
    reason: Notion adapter 不应靠搜索猜测目标页，而应读取显式映射和权限状态。
  -
    from: workspace-authority
    to: global-workspace
    relationship: is source of truth for
    reason: DR003 决定用户级 workspace manifest 承载全局对象身份、绑定、关系和 policy refs。
  -
    from: workspace-authority
    to: object-registry
    relationship: defines objects for
    reason: 维护对象注册表从 workspace manifest 读取纳入项目、别名、remote refs 和 adoption status。
  -
    from: workspace-authority
    to: project-link-graph
    relationship: defines relations for
    reason: Project Link Graph 引用 workspace 内稳定对象 id，避免关系散落在项目摘要文件中。
  -
    from: workspace-authority
    to: global-sync-targets
    relationship: defines backend targets for
    reason: Notion 等后端路径和 access gate 是 Global Workspace 的长期配置。
  -
    from: workspace-authority
    to: projects-derived-view
    relationship: derives compatibility view into
    reason: "`projects.yaml` 继续供现有 Global TUI / project switcher 使用，但不作为 authority。"
  -
    from: operation-queue
    to: maintenance-evidence-store
    relationship: records queue state in
    reason: queue、ledger、cache 和 apply/verify evidence 是操作状态，应从 workspace manifest 中拆出。
  -
    from: maintenance-evidence-store
    to: root-entry
    relationship: surfaces current operations in
    reason: 根目录入口显示队列和证据摘要，但不直接成为 source of truth。
open_questions:
  - Notion 既有项目笔记 schema 如何映射到维护对象字段？
  - 字段级 authority 是否需要从第一版开始支持？
  - "`workspace.yaml` 的第一版 schema 如何从 DR001/DR002 的项目对账和分类结果生成 draft？"
  - 非项目对象（文章、笔记、发布项）是否进入第一版验收？
  - 不同 artifact 类型应该如何映射到 Notion：数据库字段、页面正文、子页面、附件，还是链接引用？
  - Prompt 和 Report 是否应同步全文、摘要、索引，还是只同步 latest/current？
  - 架构图应以 Mermaid 文本、渲染图片、还是 Notion block 结构同步？
  - 文档同步需要双向编辑还是本地到 Notion 的单向发布？
  - 每类 artifact 的 Notion 投影方式是什么：字段、正文、子页面、索引、链接或摘要？
  - 哪些 artifact 需要双向同步，哪些必须本地单向权威？
  - 第一版是否需要覆盖全部 artifact 类型的实际同步，还是先实现 catalog/diff 加部分 apply？
  - Storage Sync Template 的最小抽象是 page tree、record schema、artifact slots、还是 operation protocol？
  - 进度锚定页面应该包含哪些固定区块：当前状态、Cycle/maintenance queue、artifact index、last sync、blocked items、links？
  - pre-Workflow 项目的进度如何表示：manual snapshot、legacy import、还是 pending-init？
  - ntn 调研需要从哪个 Notion 根页面或数据库开始，只读范围如何限定？
  - ntn 只读调研应从哪个 Notion 根页面/数据库开始？
  - 进度锚定页面的固定区块是什么？
  - Storage Sync Template 第一版是否需要支持 Notion 以外的真实后端，还是只保证 adapter contract？
  - Workflow-managed / pre-Workflow / unmanaged 项目的分类规则和展示规则是什么？
  - Deep Research 阶段是否只读 Notion，还是允许创建测试页面/沙盒页面？
  - 第一版应更偏 schema discovery、local dry-run，还是 end-to-end 但只覆盖少量项目？
  - 项目进度锚定页是否应成为所有 artifact 同步的强制入口？
  - Project Home 上 README-like 项目介绍应从 README、PROJECT-SUMMARY、architecture 还是手写 metadata 生成？
  - 进度图表第一版是 Mermaid/文本表格，还是 Notion database view？
  - Cycle 子页面应从 archives/C*/summary.md 生成，还是从 state/log/report 聚合？
  - Knowledge 子树是否直接镜像 .pipeline/knowledge/ 与 docs/，还是先只同步 compact/index？
  - 当前 Hypo-Workflow 项目的 Notion 目标父页面/项目页在哪里？
  - Project Home 的 README-like 内容源优先级是什么？
  - Cycle 子页第一版是否从归档 summary 生成？
  - Knowledge/docs 子树第一版是否只同步 compact/index 而非全文？
  - 全局层哪些内容允许同步到 Notion，哪些只能留在本地：规则、Secret 引用、Knowledge、项目关系、队列？
  - Project Link Graph 第一版的关系类型和 authority 应如何定义？
  - 全局 Knowledge 是新建独立 ledger，还是从各项目 `.pipeline/knowledge/` compact/index 聚合生成？
  - Global Secret Store 第一版应使用 `~/.hypo-workflow/secrets.yaml`、OS/keychain，还是二者抽象为可插拔 backend？
module_cards:
  -
    id: MC-maintenance-store
    title: Maintenance Store
    responsibilities:
      - 对象注册
      - 状态快照
      - 对象级事件日志
      - 阻塞/冲突记录
    inputs:
      - 项目 .pipeline 状态
      - Notion 页面/数据库记录
      - 用户维护规则
    outputs:
      - 对象状态表
      - 待同步 diff
      - 维护历史摘要
  -
    id: MC-notion-sync-domain
    title: Notion Sync Domain
    responsibilities:
      - 读取 Notion 现有项目笔记
      - 映射字段
      - 生成 dry-run diff
      - 提交外部写入后记录证据
    inputs:
      - Notion API/schema
      - 对象 registry
      - 字段 authority policy
    outputs:
      - sync plan
      - apply result
      - verification evidence
  -
    id: MC-artifact-projection
    title: Artifact Catalog And Projection
    responsibilities:
      - 分类 Workflow artifacts
      - 维护 source/derived/publication/evidence 类型
      - 选择 Notion 投影方式
      - 生成 artifact-level diff
    inputs:
      - .pipeline/PROGRESS.md
      - .pipeline/architecture.md
      - .pipeline/prompts/**
      - .pipeline/reports/**
      - docs/**
      - Notion mapping policy
    outputs:
      - artifact catalog
      - Notion projection plan
      - artifact sync diff
  -
    id: MC-storage-template
    title: Storage Sync Template
    responsibilities:
      - 定义通用页面树/slot/schema/operation 模板
      - 支持 Notion 以外的后端
      - 隔离 backend-specific 映射
    inputs:
      - artifact catalog
      - object registry
      - backend discovery result
    outputs:
      - storage mapping draft
      - backend operation plan
  -
    id: MC-progress-anchor
    title: Progress Anchor Page
    responsibilities:
      - 定义每项目固定锚定结构
      - 承载项目接入状态
      - 展示进度和 artifact index
      - 作为后续同步挂载点
    inputs:
      - project registry
      - .pipeline state/progress
      - adoption classifier
    outputs:
      - anchor page plan
      - anchor sync diff
  -
    id: MC-project-home-template
    title: Project Home Template
    responsibilities:
      - 生成 README-like 项目介绍
      - 展示当前状态和进度图表
      - 挂载 Cycle/Knowledge/Docs/Prompts/Reports 子页面入口
      - 记录 sync status
    inputs:
      - README.md
      - PROJECT-SUMMARY.md
      - .pipeline/state.yaml
      - .pipeline/archives/**/summary.md
      - .pipeline/knowledge/**
      - docs/**
    outputs:
      - Project Home dry-run plan
      - page tree mapping
  -
    id: MC-current-project-pilot
    title: Current Hypo-Workflow Pilot
    responsibilities:
      - 只针对当前项目生成 page tree dry-run
      - 验证 artifact slots
      - 发现缺失/过大/不适合同步的 artifact
    inputs:
      - current repository artifacts
      - optional Notion target page scope
    outputs:
      - pilot mapping report
      - first Project Home plan
  -
    id: MC-workspace-authority
    title: Workspace Authority Manifest
    responsibilities:
      - 定义 `~/.hypo-workflow/workspace.yaml` schema
      - 从 DR001/DR002 生成 workspace draft
      - 派生 `projects.yaml` 兼容视图
      - 检查 workspace / projects / Notion binding drift
    inputs:
      - DR001 global project reconciliation
      - DR002 project classification taxonomy
      - existing `~/.hypo-workflow/projects.yaml`
      - project `.pipeline` status snapshots
    outputs:
      - workspace draft
      - projects derived view
      - drift report
