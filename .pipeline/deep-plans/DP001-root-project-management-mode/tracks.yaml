tracks:
  -
    id: T001
    title: 根目录管理的真实闭环
    type: requirement
    status: open
    questions:
      - 根目录模式最小可用闭环是查看所有项目进度，还是还必须能批量同步/恢复/继续？
      - 根目录本身是否拥有独立 .pipeline，还是只读取/调度子项目 .pipeline？
    decisions:

    risks:
      -
        id: R001
        statement: 如果根目录和子项目都写 Workflow 状态，可能出现双 source-of-truth。
    relationships:
