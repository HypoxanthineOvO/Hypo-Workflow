  -
    id: T003
    title: 用户界面与命令入口
    type: theme
    status: secondary
    questions:
      - "根目录管理模式应是 CLI/TUI 命令、/hw:* slash command，还是两者都需要？"
      - 状态面需要展示项目列表、选中项目详情、跨项目告警、还是可执行 action queue？
      - 根目录中控台是否只做对象状态聚合与操作队列展示？
    decisions:

    risks:
      -
        id: R003
        statement: 现有 Global TUI 被定义为配置管理器，不是 workflow action center；直接扩展可能违背既有契约。
    relationships:
