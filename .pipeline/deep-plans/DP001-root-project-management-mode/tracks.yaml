  -
    id: T004
    title: 长期维护态与数据对象模型
    type: requirement
    status: active
    questions:
      - 维护态是否应该管理 Project、Article、Sync Target、Notion Database 等对象，而不是管理代码变更？
      - 维护对象需要哪些状态：dirty、synced、stale、blocked、scheduled、needs_review？
      - 维护对象的历史是 append-only ledger，还是可覆盖的 current snapshot 加事件日志？
    decisions:

    risks:
      -
        id: R004
        statement: 如果维护态只是一个特殊 Cycle，会继续继承 Cycle 的线性时间模型，无法自然表达多对象并行维护。
      -
        id: R005
        statement: 如果直接做成 Notion 同步器，会把 Workflow 的通用管理模式锁死在单个集成上。
    relationships:
      depends_on:
        - object Object
      blocks:
