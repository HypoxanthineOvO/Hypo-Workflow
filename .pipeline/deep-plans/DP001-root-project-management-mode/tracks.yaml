  -
    id: T002
    title: 跨项目同步与状态聚合
    type: theme
    status: open
    questions:
      - 根目录模式应该刷新 registry 摘要，还是为每个项目刷新 derived artifacts？
      - 批量操作失败时是 stop、skip_defer、还是按项目生成问题队列？
    decisions:

    risks:
      -
        id: R002
        statement: 跨项目 sync 可能带来外部副作用、长耗时和派生产物污染。
    relationships:
