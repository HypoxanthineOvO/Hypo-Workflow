  -
    id: T006
    title: Workflow Artifact Catalog 与 Notion 投影
    type: requirement
    status: active
    questions:
      - 进度、架构图、prompt、report、文档分别属于 source artifact、derived artifact、execution evidence 还是 publication artifact？
      - 每类 artifact 同步到 Notion 时采用摘要、全文、索引、链接还是页面层级？
      - 哪些 artifact 允许 Notion 回写，哪些必须本地单向权威？
    decisions:
      -
        id: D006
        status: accepted
        statement: 同步范围包含多类 Workflow artifacts，必须用通用 artifact catalog 和投影规则建模。
    risks:
      -
        id: R008
        statement: 不区分 artifact 类型会导致 prompt/report/文档被用同一字段同步，产生长度、冲突和可读性问题。
      -
        id: R009
        statement: 把 Notion 当作 source of truth 回写 prompt/report 可能破坏 Workflow 的本地审计链。
    relationships:
      depends_on:
        - object Object
      blocks:
        - object Object
      conflicts_with:
        - object Object
      feeds_into_plan:
        - object Object
    evidence_refs:
      - "user-artifact-scope-2026-05-18T15:50:01+08:00"
  -
    id: T007
    title: Storage Sync Template 与多后端适配
    type: requirement
    status: active
    questions:
      - 通用模板是否由 page tree、artifact slots、record schema、operation protocol 四部分组成？
      - 如何让 Notion 页面、文件系统目录、未来数据库/知识库都能复用同一同步计划？
      - 每个项目的页面路径差异应通过 per-project mapping 还是 discovery result 表达？
    decisions:
      -
        id: D008
        status: accepted
        statement: Notion 是首个 storage adapter，但核心必须是通用 Storage Sync Template。
    risks:
      -
        id: R010
        statement: 如果 storage template 抽象不清，Notion 适配会把页面结构假设泄漏到核心维护模型。
    relationships:
      depends_on:
        - object Object
      blocks:
        - object Object
      conflicts_with:
        - object Object
      feeds_into_plan:
        - object Object
    evidence_refs:
      - "user-storage-template-2026-05-18T15:59:28+08:00"
  -
    id: T008
    title: 进度锚定页面与项目接入状态
    type: requirement
    status: active
    questions:
      - 进度锚定页面应固定包含哪些区块？
      - Workflow-managed、pre-Workflow、unmanaged 项目如何显示不同状态和缺失 artifact？
      - 第一批 Milestone 是只生成本地 dry-run 页面计划，还是允许真实写入 Notion？
    decisions:
      -
        id: D009
        status: accepted
        statement: 项目接入状态必须区分 Workflow-managed、pre-Workflow 和 unmanaged。
      -
        id: D010
        status: accepted
        statement: 第一批 Milestone 先建立进度锚定页面。
    risks:
      -
        id: R011
        statement: 如果先同步复杂 artifacts 而没有进度锚定页，后续每类内容缺少稳定挂载位置。
    relationships:
      depends_on:
        - object Object
      blocks:
        - object Object
      conflicts_with:
        - object Object
      feeds_into_plan:
        - object Object
    evidence_refs:
      - "user-progress-anchor-2026-05-18T15:59:28+08:00"
  -
    id: T009
    title: Global Workspace 与跨项目联动层
    type: requirement
    status: active
    questions:
      - 全局层哪些对象应该同步到 Notion，哪些只保留在本地：规则、Secret 引用、Knowledge、项目关系、同步队列？
      - 项目联动关系第一版应表达哪些关系：depends_on、related_to、shares_rules、shares_secret_ref、shares_knowledge、syncs_to？
      - "`workspace.yaml` 的第一版 schema 如何从 DR001/DR002 的项目对账和分类结果生成 draft？"
    decisions:
      -
        id: D023
        status: accepted
        statement: 根目录项目管理模式需要一个 Global Workspace 层，覆盖项目注册、跨项目联动、全局规则、全局 Knowledge、Secret 引用和同步目标。
      -
        id: D024
        status: accepted
        statement: Secret 维护允许 raw key 存在于全局本地 secret store，但可同步层只记录引用和健康状态。
      -
        id: D025
        status: proposed
        statement: 第一版 Global Workspace 候选对象为 Workspace Home、Project Registry、Project Link Graph、Global Rules、Global Secret References、Global Knowledge Index、Sync Targets 和 Maintenance Queue。
      -
        id: D026
        status: accepted
        statement: 第一版 Global Workspace 的 source of truth 采用 `~/.hypo-workflow/workspace.yaml`；`projects.yaml` 只作为派生兼容视图，maintenance 目录保存队列、ledger、cache 和证据。
    risks:
      -
        id: R014
        statement: 如果全局层直接复制各项目 raw Knowledge/Docs，会导致上下文膨胀、重复和过期；第一版应聚合 compact/index 和链接。
      -
        id: R015
        statement: 如果 Secret 维护没有严格区分 reference 与 value，Notion 同步和 Knowledge 索引可能造成凭据泄漏。
      -
        id: R016
        statement: 如果 Project Registry 与 Project Link Graph 都可手写且互相覆盖，会出现跨项目关系的双 source-of-truth。
      -
        id: R017
        statement: 如果把 `projects.yaml` 扩展为大而全的 authority，会破坏现有 Global TUI / project switcher 的轻量摘要契约。
    relationships:
      depends_on:
        - object-registry
        - policy-engine
        - storage-template
      blocks:
        - ordered_feature_queue:F001
        - ordered_feature_queue:F002
      conflicts_with:
        - root-entry-as-only-source-of-truth
        - projects-yaml-as-global-authority
      feeds_into_plan:
        - ordered_feature_queue:F001
        - ordered_feature_queue:F004
        - ordered_feature_queue:F005
    evidence_refs:
      - "user-global-layer-2026-05-18T18:06:57+08:00"
