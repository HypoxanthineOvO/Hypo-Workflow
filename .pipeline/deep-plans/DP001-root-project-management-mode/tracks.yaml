  -
    id: T005
    title: Notion 同步作为首个维护域
    type: theme
    status: active
    questions:
      - Notion 同步的规则层需要描述哪些内容：项目到数据库映射、字段 schema、冲突策略、写入频率、dry-run/commit 边界？
      - 首次同步和日常同步如何共享规则但走不同执行模式？
      - 同步证据应该保存到本地 ledger、Notion 页面、还是两者都保存？
    decisions:

    risks:
      -
        id: R006
        statement: Notion 远端写入是外部副作用；没有 dry-run、diff 和审计日志会导致不可追踪的数据污染。
    relationships:
      depends_on:
