pipeline:
  name: "C10 一系列体验优化"
  source: local
  output: local
  prompts_dir: .pipeline/prompts
  reports_dir: .pipeline/reports

default_workflow_kind: build

plan:
  mode: interactive
  interaction_depth: high
  interactive:
    min_rounds: 5
    require_explicit_confirm: false

execution:
  mode: self
  worker_separation:
    mode: strict
    authorization:
      status: authorized
      scope:
        - /hw:start
        - /hw:resume
      granted_by: user
      fallback_when_declined: block_start
      downgrade_requires_confirmation: true
      confirmed_by_user: true
    roles:
      implement:
        required: true
      test:
        required: true
      audit:
        required: true
    evidence:
      log_roles: true
      report_roles: true
  steps:
    preset: tdd
  step_overrides:
    review_tests:
      executor: subagent
      subagent_tool: codex
      strict: false
    review_code:
      executor: subagent
      subagent_tool: codex
      strict: false

batch:
  decompose_mode: upfront
  failure_policy: skip_defer
  auto_chain: true
  default_gate: auto

evaluation:
  auto_continue: true
  max_diff_score: 3
  checks:
    - tests_pass
    - no_regressions
    - matches_plan
    - code_quality

output:
  language: zh-CN
  timezone: Asia/Shanghai
