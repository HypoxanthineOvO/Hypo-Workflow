    desired_effect: >
      Hypo-Workflow 支持 Plan 前的深度讨论小周期，可以长期沉淀需求、架构、模块 drilldown、测试矩阵和 readiness，再显式转入普通 Plan / Feature Queue。
    verification:
      method: automated-and-manual
      scenario: >
        自动 fixture 覆盖 multi-round deep plan lifecycle；手动用 Hypo-Agent 重新规划，确认后续 Feature Queue 执行顺序、验收深度、风险和未知项在 convert 前清楚可见。
        后段验收还要覆盖 research-code：经确认后下载/克隆参考项目源码并读取实现证据，不能只接受 README 摘要。
      pass_signal: deep-plan tests, regression, sync checks, and Hypo-Agent manual playbook pass
      independent_validator: test worker plus audit worker
      audit_policy:
        reject_pseudo_tests: true
        pseudo_test_rule: Reject static-doc-only or one-shot shallow planning evidence.
