        key: curated-platform-adapter-contracts
        record_patch:
          body: >-
            Future non-Codex adapter work starts from a current capability/interface map and validates the exact host
            schema instead of assuming parity. Claude integrations expose Workflow under /hw:* and must keep native
            /resume separate from /hw:resume; settings merges preserve backup/conflict evidence and each hook is
            validated for its event and exit-code contract. OpenCode user-visible commands require its current native
            registration surface as well as internal dispatch. These are deferred adapter requirements, not a claim that
            Claude or OpenCode is a current C21 backend.
          confidence: high
          created_at: 2026-05-14T23:30:00+08:00
