        key: c21-current-stash-suspend-reconciliation
        record_patch:
          body: >-
            The deferred Workflow Stash model is Checkpoint + Suspend + Blocking Delivery + Reconciliation, not git
            stash or a code snapshot. Push records Workflow contracts, evidence, remaining work, blocker, resume
            condition, HEAD and dirty paths while leaving the worktree in place and warning about overlap risk. Pop
            waits for the blocker condition, reads the accepted new baseline, creates a Resume Merge Plan, reconciles
            old assumptions forward, updates affected Milestones and verification, and preserves history. Adaptive mode
            auto-resolves only low-ambiguity mappings and asks on semantic conflict; strict mode requires approval for
            every contract difference. Failed reconciliation remains recoverable rather than pretending restoration
            succeeded.
          confidence: high
          created_at: 2026-07-11T20:09:41+08:00
