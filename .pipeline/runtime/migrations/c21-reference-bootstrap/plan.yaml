              updated_at: 2026-07-11T20:24:08+08:00
            body: >-
              Hypo-Workflow is a Skill-first protocol and control layer, not a runner. The host Agent performs reasoning,
              implementation, testing, and review; deterministic Core owns schema, transactions, Records, Receipts, recovery,
              lifecycle transitions, adapter payloads, and mechanical gates. Every fact has one authority. Platform adapters
