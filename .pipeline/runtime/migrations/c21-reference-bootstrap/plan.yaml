        remain M8 cleanup candidates. User-stated requirements, preferences, feedback, authorization scope, and turn- or
        Delivery-scoped constraints remain supported at their actual scope: confirmed durable facts become individual
        Records, while user confirmation, execution grants, and dangerous-operation grants use actor-, scope-,
        plan-hash-, expiry-, and consumption-bound Receipts. Adapters and Markdown guidance are projections and cannot
        become competing authority. A scoped constraint or grant must not be silently promoted into a permanent global
        rule.
