        key: c21-current-m8-cleanup-deletion-gate-route
        record_patch:
          body: >-
            C21-M8 starts only after M7 by rescanning the live dependency graph and classifying each candidate as
            delete, retain_internal, or deferred_hidden. It may generate the complete Deletion Manifest but may not
            delete anything until the full decision context is shown in chat and the user issues a fresh exact
            deletion.execute Receipt. Any path hash or relevant Git-state drift invalidates the Receipt. The controlled
            batch must remove registry/generator sources before derived artifacts, prove regeneration cannot revive
            removed or deferred surfaces, preserve unrelated changes, update the Codex-facing package/docs, run
            behavior-based Skill evaluations and full regression, and finish with independent audit. C21 itself still
            closes through manual acceptance after M8; no Deletion Manifest approval can be inferred from general Cycle
            authorization.
          confidence: high
          created_at: 2026-07-11T20:39:36+08:00
