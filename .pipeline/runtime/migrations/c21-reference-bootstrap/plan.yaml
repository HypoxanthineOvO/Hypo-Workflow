              verification, Resume, manual Accept/Reject, and the exact nine-command surface. Goal uses one Design. Cycle uses
              ordered Milestones and one final acceptance. Plan first resolves configuration and inherited-state assumptions
              that materially affect discovery, abstracts user examples into general requirements, and shows the actual
