            implementation, testing, and review; deterministic Core owns schema, transactions, Records, Receipts,
            recovery, lifecycle transitions, adapter payloads, and mechanical gates. Every fact has one authority.
            Platform adapters only project behavior. Runtime and memory are local/ignored; accepted or explicit
            checkpoint Snapshots may enter Git. A valid new manifest selects the new writer, while a damaged manifest
            fails closed and never falls back to legacy writers.
