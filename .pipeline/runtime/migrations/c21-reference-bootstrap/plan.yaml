              legacy state.yaml, cycle.yaml, and log.yaml are unchanged. Do not import raw chat/tool logs/secrets, delete
              tracked legacy files, dual-write, or migrate arbitrary repositories. Derive only a redacted fixed CI fixture from
              the reference workspace.
