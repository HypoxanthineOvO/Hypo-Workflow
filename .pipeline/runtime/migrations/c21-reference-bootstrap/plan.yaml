        updated_at: 2026-07-11T20:49:59+08:00
      body: >-
        Recovery uses an append-only object Journal of explicit rationale/evidence summaries, a derived and rebuildable
        Context Capsule, and a validated Recovery Pack with cursor, hashes, continuation, relevant Records, evidence,
        and bounded recent context. Hidden chain-of-thought, scratchpads, raw transcripts, and secret values never
        become authority. Transcript input is optional convenience only. If the newest Pack is invalid, restore a valid
        ancestor and replay the required Journal delta. Detailed recovery data stays local/ignored; future telemetry may
        aggregate redacted events but cannot change recovery correctness semantics.
      path: .pipeline/memory/records/project-d604d20eae74/decision/decision-2781e42f50ffefa833b55042b3a799ee.md
