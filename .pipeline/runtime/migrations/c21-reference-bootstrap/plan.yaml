        ---

        The authoritative C21 public/contextual discovery surface contains exactly /hw:guide, /hw:init, /hw:goal,
        /hw:plan, /hw:cycle, /hw:maintain, /hw:resume, /hw:accept, and /hw:reject. User-visible commands must be
        registered in the authoritative registry; generated documentation, adapters, and command-inventory tests are
        projections of that registry. Chat, Explain, Status, Report, Log, Check, Compact, Knowledge, consistency Sync,
        Debug, explicit start, and Plan phases are natural/internal behavior. Setup, Rules, Stop command, Skip, Reset,
