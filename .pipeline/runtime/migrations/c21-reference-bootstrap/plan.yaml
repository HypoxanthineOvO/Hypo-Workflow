            retry evidence; never silently downgrade a prompt that requires separation. Worker input separates the
            host-rule envelope from task-specific checks, and unavailable worker support must produce an explicit
            governed fallback. Small reversible changes may use solo-verified only when policy selects it. Migration
            additionally uses read-only Extractors, a proposal-only Curator, an independent Auditor, and one
            deterministic writer; proposal workers cannot write authoritative Records.
