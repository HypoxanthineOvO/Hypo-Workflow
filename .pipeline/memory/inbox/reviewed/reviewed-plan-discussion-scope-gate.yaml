record_patch:
  body: >-
    # Plan discussion scope gate


    Plan defaults to a guided planning discussion. Unless the user explicitly asks the Agent to generate a Plan directly
    from the supplied requirements, the Agent must first discuss the work through relevant Discover, Technical,
    Architecture, and other scope-specific topics.


    Before writing a Proposal, the Agent must:


    1. establish a clear, user-visible discussion scope;

    2. discuss every item in that scope;

    3. recap the scoped items and explicitly ask the user whether they have all been discussed sufficiently and whether
    Proposal writing may begin.


    Only the user’s explicit confirmation at that checkpoint authorizes Proposal writing. Statements such as “可以”, “对”,
    agreement with an idea, or positive feedback on an intermediate recommendation confirm that content only; they do
    not close Discussion, authorize Proposal writing, or authorize execution.


    Proposal approval and execution authorization remain a later, separate gate. The Agent must never collapse
    discussion completion, Proposal writing, Proposal approval, and execution start into one inferred transition.
