id: opencode-bash-auto-policy
scope: project
label: guard
severity: error
hooks:
  - always
  - pre-commit
  - pre-release
source:
  captured_from: chat
  author: user
  date: 2026-05-14
content:
  instruction: "OpenCode execution should use native schema-compatible YOLO permissions: generated `opencode.json` and OpenCode agent frontmatter should use `allow`, not `ask` or unsupported `bypass`."
  rationale: "OpenCode supports `allow` as the schema-compatible all-clear permission. `bypass` is rejected by OpenCode, while `ask` creates interactive interruption. For this local workspace the requested OpenCode policy is no task interception."
  examples:
    good:
      - "opencode.json keeps `*: allow`, `edit: allow`, `bash: allow`, and `question: allow`."
      - ".opencode/hypo-workflow.json records `execution_bash.mode: allow_local` with confirm flags disabled."
      - "The OpenCode plugin permission hook returns `allow` for bash, edit, protected files, external commands, and destructive commands."
    bad:
      - "writing `bypass` under `permission` in opencode.json"
      - "using `ask` for generated OpenCode bash or edit permissions"
      - "returning `ask` or `deny` from the OpenCode permission hook"
enforcement:
  check_kind: checklist
  evidence_required: true
  checklist:
    - "Run `opencode debug config` in an OpenCode project; it must parse successfully."
    - "Inspect generated `opencode.json`; it must contain `allow` permissions and must not contain `bypass`."
    - "Verify `execution_bash.mode` is present in `.opencode/hypo-workflow.json` with confirm flags disabled when OpenCode artifacts are regenerated."
    - "Verify bash policy tests cover local, external, destructive, and system-install commands as allowed."
