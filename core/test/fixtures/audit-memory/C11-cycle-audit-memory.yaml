audit_memory:
  schema_version: 1
  cycle_id: C11
  created_at: "2026-05-10T00:00:00+08:00"
  updated_at: "2026-05-10T00:00:00+08:00"
  source_authority:
    - user_special_requirements
    - project_rules_summary
    - cycle_decisions
  user_special_requirements:
    -
      id: USR-C11-001
      summary: User special requirements must survive plan/start/resume handoff.
      source: planning_session
      scope: cycle
    -
      id: USR-C11-002
      summary: Audit must be able to check missing user requirement carry-over.
      source: planning_session
      scope: cycle
  project_rules_summary:
    -
      id: prefer-chinese-output
      severity: warn
      summary: User-facing explanations and generated summaries prefer Chinese.
    -
      id: worker-separation
      severity: guard
      summary: Test, implement, and audit roles must stay separated.
  cycle_decisions:
    -
      id: D-C11-001
      summary: Audit memory is durable cycle authority for special requirements.
      source: confirm-summary
    -
      id: D-C11-002
      summary: Raw conversation may inform capture but is not the source of truth.
      source: confirm-summary
  raw_conversation:
    retained: false
    authority: false
    note: Raw free-form planning chat must not be the only authority.
