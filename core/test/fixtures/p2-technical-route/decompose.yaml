technical_route_contract:
  required_for_each_milestone:
    - technical_solution
    - technical_route
    - research_required
    - risks_and_alternatives
    - validation_path
    - audit_focus
  hard_research_gate:
    enabled: true
    triggers:
      - unknown_tool
      - external_service
      - third_party_library
      - platform_capability
      - user_private_schema
  challenge_behavior:
    on_user_route_challenge: "return to revision/in_progress for targeted research and a revised checkpoint"

milestones:
  - id: C15-M1
    name: P2 Technical Route Gate
    technical_solution: "Add a contract-level test for P2 technical route requirements."
    technical_route: "Assert source docs and fixtures without reading ignored runtime state."
    research_required: "resolved: no external service or unknown tool is required."
    risks_and_alternatives: "Fixture drift is controlled by testing source docs in the same suite."
    validation_path: "Run the focused node test and adjacent planning tests."
    audit_focus: "Verify no ignored runtime path is required."
  - id: C15-M2
    name: P3 Route Preservation
    technical_solution: "Carry P2 route fields into generated worker prompt content."
    technical_route: "Require each generated prompt to keep the six route fields."
    research_required: "deferred_by_user: none; no unresolved blocking question."
    risks_and_alternatives: "Prompt text may change, so source contract wording is also asserted."
    validation_path: "Check a generated prompt fixture plus P3 source contract docs."
    audit_focus: "Confirm route fields are preserved and not compressed into goals only."

research_gate_summary:
  status: resolved
  blocking_questions: []
